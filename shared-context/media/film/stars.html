<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stars</title>
<link rel="stylesheet" href="fonts.css">
<script>if (/[?&]deck/.test(location.search)) document.documentElement.classList.add('deck');</script>
<style>
  html,body{margin:0;background:#0b0d12;color:#f2ece4;font-family:Manrope,system-ui,sans-serif} main{max-width:1280px;margin:0 auto;padding:24px 20px}.frame{overflow:hidden;background:#0b0d12}.deck main{max-width:none;padding:0}.deck .bar{display:none}#film{display:block;width:100%;height:auto;aspect-ratio:16/9}.deck #film{width:100vw;height:100vh;aspect-ratio:auto}.bar{display:flex;gap:12px;padding:12px}.bar input{flex:1}
  </style>
</head>
<body><main><div class="frame"><svg id="film" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A rope team looks up from a summit as the stars become a graph.">
  <style>.serif{font-family:'Source Serif 4',Georgia,serif;font-weight:700}.sans{font-family:Manrope,Arial,sans-serif;font-weight:600}.halo{paint-order:stroke;stroke:#0b0d12;stroke-width:12px;stroke-linejoin:round}</style>
  <defs><radialGradient id="bgGlow" cx="50%" cy="56%" r="58%"><stop offset="0" stop-color="#2a2622"/><stop offset="1" stop-color="#0e0d0c"/></radialGradient><radialGradient id="coolGlow" cx="50%" cy="52%" r="72%"><stop offset="0" stop-color="#182133"/><stop offset="1" stop-color="#0b0d12"/></radialGradient><filter id="og" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="1920" height="1080" fill="#0e0d0c"/><rect id="warmBg" width="1920" height="1080" fill="url(#bgGlow)" opacity=".55"/><rect id="coolBg" width="1920" height="1080" fill="url(#coolGlow)" opacity="0"/>
  <g id="stars"></g><g id="terrain" fill="none" stroke-linecap="round" stroke-linejoin="round"></g><g id="flag"><line id="pole" stroke="#f2ece4" stroke-width="4"/><path id="pennant" fill="#ff6a1f" filter="url(#og)"/></g><g id="team"></g><g id="graph" fill="none" stroke-linecap="round"></g><g id="nodes"></g><g id="kindLabels"></g>
  <g text-anchor="middle"><text id="headline" class="serif halo" x="960" y="142" font-size="68" fill="#f2ece4"></text><text id="subline" class="sans halo" x="960" y="204" font-size="31" fill="#c6d0df"></text></g>
  </svg></div><div class="bar"><button id="play" type="button">Pause</button><input id="scrub" type="range" min="0" max="16" step="0.01" value="0"><span id="time"></span><button id="save" type="button">Save frame as SVG</button></div></main>
<script src="filmkit.js"></script>
<script>
(function(){
  const K=FilmKit,$=K.$;
  // beats: 0-5.5 tilt up | 5.5-11 graph traces | 11-16 kinds reveal and settle
  const DUR=16,HOLD=16;
  const START={tx:20,ty:220,tz:800,d:3750,yaw:-0.10,pitch:0.53};
  const KEYS=[Object.assign({t:0},START),Object.assign({t:1},START),{t:5.5,tx:20,ty:420,tz:800,d:3750,yaw:-0.10,pitch:-0.17},{t:16,tx:20,ty:420,tz:800,d:3750,yaw:-0.10,pitch:-0.17}];
  const T=K.terrain($('terrain')), stars=K.stars($('stars'),150,54,1080), P=[0,0,0];
  const team=K.CAST_ORDER.map(function(id){return {id:id,S:K.sprite($('team'),{glow:id==='claude'})};});
  // Six readable walkers cluster around the same summit and flag as together.html's last shot.
  const teamPos=[[520,875],[300,800],[700,800],[360,1030],[680,1030],[520,1100]];
  // This seeded screen-space layout is deliberately identical in sky.html, so scene 7 opens on this hold.
  function graphLayout(){const r=K.rng(6027),a=[];for(let i=0;i<52;i++){a.push({x:130+r()*1660,y:310+r()*590,k:i%4,seed:r(),links:[]});}a[0].x=330;a[0].y=485;a[1].x=1450;a[1].y=490;a[2].x=1320;a[2].y=800;a[3].x=560;a[3].y=805;for(let i=0;i<a.length;i++){const near=a.map(function(n,j){return {j:j,d:Math.hypot(a[i].x-n.x,a[i].y-n.y)};}).filter(function(o){return o.j!==i;}).sort(function(u,v){return u.d-v.d;}).slice(0,2+(i%3===0?1:0));near.forEach(function(o){if(!a[i].links.includes(o.j)&&!a[o.j].links.includes(i))a[i].links.push(o.j);});}return a;}
  const N=graphLayout(), edges=[];N.forEach(function(n,i){n.links.forEach(function(j){edges.push([i,j]);});});
  const edgeEls=edges.map(function(){return K.mk('path',{stroke:'#aebdd4','stroke-width':'1.4'},$('graph'));});
  const nodeEls=N.map(function(){return K.mk('path',{fill:'#f2f5fb',filter:'url(#og)'},$('nodes'));});
  const names=['decisions','code','people','questions'], reps=[N[0],N[1],N[2],N[3]];
  const labels=names.map(function(name){return K.label($('kindLabels'),name,{size:23,h:48,lift:82});});
  function shape(n,size){const x=n.x,y=n.y;if(n.k===0)return 'M'+x+' '+(y-size)+'L'+(x+size)+' '+y+'L'+x+' '+(y+size)+'L'+(x-size)+' '+y+'Z';if(n.k===1)return 'M'+(x-size)+' '+(y-size)+'h'+(size*2)+'v'+(size*2)+'h-'+(size*2)+'Z';if(n.k===2)return 'M'+x+' '+(y-size)+'a'+size+' '+size+' 0 1 1 0 '+(size*2)+'a'+size+' '+size+' 0 1 1 0 -'+(size*2);return 'M'+x+' '+(y-size)+'a'+size+' '+size+' 0 1 1 0 '+(size*2)+'a'+size+' '+size+' 0 1 1 0 -'+(size*2)+' M'+x+' '+(y-size+2)+'a'+(size-2)+' '+(size-2)+' 0 1 0 0 '+(size*2-4)+'a'+(size-2)+' '+(size-2)+' 0 1 0 0 -'+(size*2-4);}
  function drawFlag(c,a){const top=T.summit.m;K.proj(c,top[0],top[1],top[2],P);const h=26000/P[2];$('pole').setAttribute('x1',K.fx(P[0]));$('pole').setAttribute('x2',K.fx(P[0]));$('pole').setAttribute('y1',K.fx(P[1]));$('pole').setAttribute('y2',K.fx(P[1]-h));$('pennant').setAttribute('d','M'+K.fx(P[0])+' '+K.fx(P[1]-h)+'l'+K.fx(h*.62)+' '+K.fx(h*.2)+'l-'+K.fx(h*.62)+' '+K.fx(h*.2)+'z');$('flag').setAttribute('opacity',a.toFixed(3));}
  function render(t){const c=K.keyCamera(KEYS,t),tilt=K.eio(K.seg(t,0,5.5));$('warmBg').setAttribute('opacity',(.55*(1-tilt)).toFixed(3));$('coolBg').setAttribute('opacity',tilt.toFixed(3));K.drawStars(stars,t,K.eo(K.seg(t,1.5,5.5)));K.drawTerrain(T,c,1-tilt,function(L){return [125,139,166,L.hill==='m'?1:.7];},{nearFade:true});drawFlag(c,1-tilt);team.forEach(function(m,i){const q=teamPos[i],y=K.groundY(q[0],q[1]);K.proj(c,q[0],y,q[1],P);K.drawCast(m.S,m.id,P[0],P[1],Math.max(5.8,11*K.F/P[2]),1-tilt,{t:t,cadence:0,bob:false});});
    const trace=K.eio(K.seg(t,5.5,10.8));edgeEls.forEach(function(e,i){const u=K.clamp01(trace*edges.length-i);const A=N[edges[i][0]],B=N[edges[i][1]];e.setAttribute('d','M'+K.fx(A.x)+' '+K.fx(A.y)+'L'+K.fx(K.lerp(A.x,B.x,u))+' '+K.fx(K.lerp(A.y,B.y,u)));e.setAttribute('opacity',(u*.7).toFixed(3));});N.forEach(function(n,i){const a=K.eo(K.seg(t,5.8+n.seed*2.8,7+n.seed*2.8))*K.eo(K.seg(t,10.9,12.3));nodeEls[i].setAttribute('d',shape(n,4.5+2*K.eio(K.seg(t,11,13))));nodeEls[i].setAttribute('opacity',a.toFixed(3));});const kindA=K.eo(K.seg(t,11.3,12.3));labels.forEach(function(L,i){K.drawLabel(L,reps[i].x,reps[i].y,kindA,kindA,'#dbe5f3');});
    const first=K.eo(K.seg(t,1.2,1.8))*(1-K.ei(K.seg(t,5.5,6.1))),second=K.eo(K.seg(t,6.1,6.8));const firstBeat=t<6.1;$('headline').textContent=firstBeat?'Look up.':'The map we share is a graph.';$('subline').textContent=firstBeat?'':'Decisions, code, people and questions, linked.';$('headline').setAttribute('opacity',(firstBeat?first:second).toFixed(3));$('subline').setAttribute('opacity',second.toFixed(3));}
  K.player(DUR,HOLD,render,'stars');
})();
</script></body></html>

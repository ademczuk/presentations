<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sky</title><link rel="stylesheet" href="fonts.css"><script>if (/[?&]deck/.test(location.search))document.documentElement.classList.add('deck');</script><style>html,body{margin:0;background:#0b0d12;color:#f2ece4;font-family:Manrope,system-ui,sans-serif}main{max-width:1280px;margin:0 auto;padding:24px 20px}.frame{overflow:hidden}.deck main{max-width:none;padding:0}.deck .bar{display:none}#film{display:block;width:100%;height:auto;aspect-ratio:16/9}.deck #film{width:100vw;height:100vh;aspect-ratio:auto}.bar{display:flex;gap:12px;padding:12px}.bar input{flex:1}</style></head>
<body><main><div class="frame"><svg id="film" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A shared graph in the stars records decisions, code and questions."><style>.serif{font-family:'Source Serif 4',Georgia,serif;font-weight:700}.sans{font-family:Manrope,Arial,sans-serif;font-weight:600}.halo{paint-order:stroke;stroke:#0b0d12;stroke-width:12px;stroke-linejoin:round}.smallhalo{paint-order:stroke;stroke:#0b0d12;stroke-width:7px;stroke-linejoin:round}</style><defs><radialGradient id="coolGlow" cx="50%" cy="52%" r="72%"><stop offset="0" stop-color="#182133"/><stop offset="1" stop-color="#0b0d12"/></radialGradient><filter id="og" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1920" height="1080" fill="#0e0d0c"/><rect width="1920" height="1080" fill="url(#coolGlow)"/><g id="stars"></g><g id="world"><g id="graph" fill="none" stroke-linecap="round"></g><g id="nodes"></g><path id="denseEdges" fill="none" stroke="#bdc9dc" stroke-width="1"/><path id="denseNodes" fill="#e7edf7"/></g><g id="routes" fill="none" stroke-linecap="round"></g><g id="cards"></g><g id="kindLabels"></g><g id="counters" class="sans" text-anchor="middle" fill="#f2f5fb"></g><g text-anchor="middle"><text id="headline" class="serif halo" x="960" y="142" font-size="68" fill="#f2ece4"></text><text id="subline" class="sans halo" x="960" y="204" font-size="31" fill="#c6d0df"></text></g><text id="illustration" class="sans smallhalo" x="54" y="1022" font-size="25" fill="#bcc8d8">illustration</text></svg></div><div class="bar"><button id="play" type="button">Pause</button><input id="scrub" type="range" min="0" max="30" step="0.01" value="0"><span id="time"></span><button id="save" type="button">Save frame as SVG</button></div></main><script src="filmkit.js"></script><script>
(function(){
  const K=FilmKit,$=K.$;
  // beats: 0-9 one decision found | 9-19 code graph measured | 19-30 route to the right person
  const DUR=30,HOLD=30,stars=K.stars($('stars'),150,54,1080);
  // This seeded screen-space layout is deliberately identical in stars.html, so this scene opens on its hold.
  function graphLayout(){const r=K.rng(6027),a=[];for(let i=0;i<52;i++){a.push({x:130+r()*1660,y:310+r()*590,k:i%4,seed:r(),links:[]});}a[0].x=330;a[0].y=485;a[1].x=1450;a[1].y=490;a[2].x=1320;a[2].y=800;a[3].x=560;a[3].y=805;for(let i=0;i<a.length;i++){const near=a.map(function(n,j){return {j:j,d:Math.hypot(a[i].x-n.x,a[i].y-n.y)};}).filter(function(o){return o.j!==i;}).sort(function(u,v){return u.d-v.d;}).slice(0,2+(i%3===0?1:0));near.forEach(function(o){if(!a[i].links.includes(o.j)&&!a[o.j].links.includes(i))a[i].links.push(o.j);});}return a;}
  const N=graphLayout(),edges=[];N.forEach(function(n,i){n.links.forEach(function(j){edges.push([i,j]);});});
  const edgeEls=edges.map(function(){return K.mk('path',{stroke:'#aebdd4','stroke-width':'1.4'},$('graph'));}),nodeEls=N.map(function(){return K.mk('path',{fill:'#f2f5fb',filter:'url(#og)'},$('nodes'));});
  const names=['decisions','code','people','questions'],reps=[N[0],N[1],N[2],N[3]],kindLabels=names.map(function(name){return K.label($('kindLabels'),name,{size:23,h:48,lift:82});});
  function shape(n,size){const x=n.x,y=n.y;if(n.k===0)return 'M'+x+' '+(y-size)+'L'+(x+size)+' '+y+'L'+x+' '+(y+size)+'L'+(x-size)+' '+y+'Z';if(n.k===1)return 'M'+(x-size)+' '+(y-size)+'h'+(size*2)+'v'+(size*2)+'h-'+(size*2)+'Z';if(n.k===2)return 'M'+x+' '+(y-size)+'a'+size+' '+size+' 0 1 1 0 '+(size*2)+'a'+size+' '+size+' 0 1 1 0 -'+(size*2);return 'M'+x+' '+(y-size)+'a'+size+' '+size+' 0 1 1 0 '+(size*2)+'a'+size+' '+size+' 0 1 1 0 -'+(size*2)+' M'+x+' '+(y-size+2)+'a'+(size-2)+' '+(size-2)+' 0 1 0 0 '+(size*2-4)+'a'+(size-2)+' '+(size-2)+' 0 1 0 0 -'+(size*2-4);}
  edgeEls.forEach(function(e,i){const A=N[edges[i][0]],B=N[edges[i][1]];e.setAttribute('d','M'+K.fx(A.x)+' '+K.fx(A.y)+'L'+K.fx(B.x)+' '+K.fx(B.y));e.setAttribute('opacity','.7');});nodeEls.forEach(function(e,i){e.setAttribute('d',shape(N[i],6.5));e.setAttribute('opacity','1');});
  function findRoute(from,to){const todo=[from],prev={};prev[from]=-1;while(todo.length){const q=todo.shift();if(q===to)break;N[q].links.forEach(function(j){if(prev[j]===undefined){prev[j]=q;todo.push(j);}});edges.forEach(function(e){if(e[1]===q&&prev[e[0]]===undefined){prev[e[0]]=q;todo.push(e[0]);}});}if(prev[to]===undefined)return [from,to];const out=[];for(let q=to;q!==-1;q=prev[q])out.unshift(q);return out;}
  const decision=0,person=2,question=47,routeOne=findRoute(46,decision),routeThree=findRoute(question,person);
  const routeLine=K.mk('path',{stroke:'#fff4cc','stroke-width':'4',filter:'url(#og)'},$('routes')),routeDot=K.mk('circle',{fill:'#fff4cc',filter:'url(#og)'},$('routes'));
  const card=K.mk('g',{},$('cards')),cardBox=K.mk('rect',{rx:'18',fill:'#1b2535',stroke:'#dbe7f7','stroke-width':'2'},card),cardText=K.mk('text',{class:'sans','text-anchor':'middle','font-size':'27',fill:'#f2f5fb'},card);cardText.textContent='decision, recorded once';
  const counterData=[{value:7133,word:'nodes'},{value:15589,word:'edges'},{value:37,word:'repositories'}];
  const counters=counterData.map(function(item,i){const g=K.mk('g',{},$('counters')),x=330,y=400+i*154,box=K.mk('rect',{x:x-145,y:y-68,width:290,height:122,rx:18,fill:'#0b0d12',opacity:'.88'},g),number=K.mk('text',{class:'sans',x:x,y:y,'font-size':'64','font-weight':'700'},g),word=K.mk('text',{class:'sans',x:x,y:y+39,'font-size':'28','font-weight':'600'},g);word.textContent=item.word;return {g:g,number:number,word:word,value:item.value};});
  const r=K.rng(111026);let denseD='',denseE='';for(let i=0;i<260;i++){const x=980+r()*520,y=350+r()*430,s=1.7+r()*1.8;denseD+='M'+K.fx(x-s)+' '+K.fx(y-s)+'h'+K.fx(s*2)+'v'+K.fx(s*2)+'h-'+K.fx(s*2)+'Z';if(i%2===0){const x2=980+r()*520,y2=350+r()*430;denseE+='M'+K.fx(x)+' '+K.fx(y)+'L'+K.fx(x2)+' '+K.fx(y2);}}$('denseNodes').setAttribute('d',denseD);$('denseEdges').setAttribute('d',denseE);
  function routePoints(list){return list.map(function(i){return N[i];});}
  function drawRoute(list,p,show){const pts=routePoints(list),parts=[],lengths=[0];for(let i=1;i<pts.length;i++)lengths.push(lengths[i-1]+Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y));const total=lengths[lengths.length-1]||1,at=total*K.clamp01(p);let dot=pts[0];for(let i=0;i<pts.length;i++){if(i>0&&lengths[i]>at){const u=(at-lengths[i-1])/(lengths[i]-lengths[i-1]);dot={x:K.lerp(pts[i-1].x,pts[i].x,u),y:K.lerp(pts[i-1].y,pts[i].y,u)};break;}dot=pts[i];}for(let i=0;i<pts.length;i++){if(i&&lengths[i]>at)break;parts.push((i?'L':'M')+K.fx(pts[i].x)+' '+K.fx(pts[i].y));}routeLine.setAttribute('d',parts.join(''));routeLine.setAttribute('opacity',show.toFixed(3));routeDot.setAttribute('cx',K.fx(dot.x));routeDot.setAttribute('cy',K.fx(dot.y));routeDot.setAttribute('r',(show*8).toFixed(2));routeDot.setAttribute('opacity',show.toFixed(3));}
  function cardAt(n,a){const x=n.x+42,y=n.y-96,w=300;cardBox.setAttribute('x',K.fx(x-w/2));cardBox.setAttribute('y',K.fx(y-31));cardBox.setAttribute('width',w);cardBox.setAttribute('height',62);cardText.setAttribute('x',K.fx(x));cardText.setAttribute('y',K.fx(y+10));card.setAttribute('opacity',a.toFixed(3));}
  const personGlow=K.mk('circle',{fill:'none',stroke:'#fff4cc','stroke-width':'3',filter:'url(#og)'},$('routes')),personLabel=K.label($('cards'),'the person who decides',{size:23,h:48,lift:82});
  function render(t){K.drawStars(stars,16+t*.14,1);const drift=t<=9?K.eio(K.seg(t,0,8))*-40:t<=19?-40+K.eio(K.seg(t,9,18))*70:30+K.eio(K.seg(t,19,28))*-25;$('world').setAttribute('transform','translate('+K.fx(drift)+' 0) scale(1)');const beat=t<=9?1:t<=19?2:3;const intro=1-K.ei(K.seg(t,.2,.6));kindLabels.forEach(function(L,i){K.drawLabel(L,reps[i].x,reps[i].y,intro,intro,'#dbe5f3');});
    const a1=K.eo(K.seg(t,0.7,1.5))*(1-K.ei(K.seg(t,9,9.6))),ill1=K.eo(K.seg(t,0,0.5))*(1-K.ei(K.seg(t,9,9.6))),ill3=K.eo(K.seg(t,19.8,20.6));$('illustration').setAttribute('opacity',(ill1+ill3).toFixed(3));const move1=K.eio(K.seg(t,3,6.7));drawRoute(routeOne,move1,a1);const pulse1=1+.75*Math.max(0,Math.sin((t-6.7)*7))*K.ei(K.seg(t,6.7,7.2))*(1-K.ei(K.seg(t,7.2,8)));nodeEls[decision].setAttribute('d',shape(N[decision],6.5*pulse1));cardAt(N[decision],K.eo(K.seg(t,1.3,2.1))*(1-K.ei(K.seg(t,9,9.6))));
    const dense=K.eo(K.seg(t,10.0,12))*(1-K.eio(K.seg(t,19,19.6)));$('denseNodes').setAttribute('opacity',dense.toFixed(3));$('denseEdges').setAttribute('opacity',(dense*.38).toFixed(3));counters.forEach(function(C,i){const a=K.eo(K.seg(t,11+i*.35,11.7+i*.35))*(1-K.ei(K.seg(t,19,19.6))),count=Math.round(C.value*K.eio(K.seg(t,11+i*.35,12.5+i*.35)));C.number.textContent=count.toLocaleString('en-US');C.g.setAttribute('opacity',a.toFixed(3));});
    const a3=K.eo(K.seg(t,19.8,20.6));if(beat===3)drawRoute(routeThree,K.eio(K.seg(t,22.0,26.5)),a3);if(beat!==3){routeLine.setAttribute('opacity',a1.toFixed(3));routeDot.setAttribute('opacity',a1.toFixed(3));}const pulse3=beat===3?(t<27.5?1+.7*Math.max(0,Math.sin((t-26.5)*6))*K.ei(K.seg(t,26.5,27.2)):1.45):1;nodeEls[person].setAttribute('d',shape(N[person],6.5*pulse3));nodeEls[question].setAttribute('d',shape(N[question],6.5*(1+.45*a3)));const personA=beat===3?K.eo(K.seg(t,26.4,27.2)):0;personGlow.setAttribute('cx',K.fx(N[person].x));personGlow.setAttribute('cy',K.fx(N[person].y));personGlow.setAttribute('r',K.fx(10+12*personA));personGlow.setAttribute('opacity',personA.toFixed(3));K.drawLabel(personLabel,N[person].x,N[person].y,personA,personA,'#fff4cc');
    if(t<.6){$('headline').textContent='The map we share is a graph.';$('subline').textContent='Decisions, code, people and questions, linked.';}else if(beat===1){$('headline').textContent='A decision, recorded once.';$('subline').textContent="Later, a colleague's Claude finds it instead of asking again.";}else if(beat===2){$('headline').textContent='A code question, answered from the graph.';$('subline').textContent="One real project's code graph, a snapshot from 11 Oct 2026.";}else{$('headline').textContent='A question goes to the person who decides.';$('subline').textContent='';}const head=t<.6?intro:beat===1?a1:beat===2?K.eo(K.seg(t,9.4,10.2))*(1-K.ei(K.seg(t,19,19.6))):K.eo(K.seg(t,19.4,20.2));$('headline').setAttribute('opacity',head.toFixed(3));$('subline').setAttribute('opacity',(beat===3?0:head).toFixed(3));}
  K.player(DUR,HOLD,render,'sky');
})();
</script></body></html>

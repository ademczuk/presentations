<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Altitude</title>
<link rel="stylesheet" href="fonts.css">
<script>if (/[?&]deck/.test(location.search)) document.documentElement.classList.add('deck');</script>
<style>
  :root { color-scheme: light dark; --page:#e9e6e1; --panel:#f6f4f1; --ink:#1d1b19; --muted:#6b665f; --line:#cfcac3; --accent:#ff6a1f; }
  @media (prefers-color-scheme: dark) { :root { --page:#141312; --panel:#1d1b19; --ink:#eeeae4; --muted:#9a948c; --line:#34312e; } }
  * { box-sizing:border-box }
  html, body { margin:0; background:var(--page); color:var(--ink); font-family:Manrope, system-ui, sans-serif }
  main { max-width:1280px; margin:0 auto; padding:24px 20px 32px }
  .frame { border-radius:10px; overflow:hidden; background:#0e0d0c; box-shadow:0 10px 30px rgba(0,0,0,.25) }
  #film { display:block; width:100%; height:auto; aspect-ratio:16/9 }
  .bar { display:flex; align-items:center; gap:14px; margin-top:14px; padding:10px 14px; background:var(--panel); border:1px solid var(--line); border-radius:10px }
  button { font:inherit; font-weight:600; font-size:14px; color:var(--ink); background:transparent; border:1px solid var(--line); border-radius:8px; padding:8px 14px; cursor:pointer }
  button:hover { border-color:var(--muted) }
  button:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:2px }
  #play { min-width:76px }
  input[type=range] { flex:1; accent-color:var(--accent); min-width:80px }
  #time { font-variant-numeric:tabular-nums; font-size:14px; color:var(--muted); min-width:92px; text-align:right }
  html.deck, html.deck body { background:#0e0d0c; overflow:hidden }
  html.deck main { max-width:none; padding:0 }
  html.deck .bar { display:none }
  html.deck .frame { border-radius:0; box-shadow:none; background:#0e0d0c }
  html.deck #film { width:100vw; height:100vh; aspect-ratio:auto }
  @media (max-width:640px) { .bar { flex-wrap:wrap } input[type=range] { order:3; flex-basis:100% } }
</style>
</head>
<body>
<main>
  <div class="frame">
    <svg id="film" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Altitude: a 22-second contour-map animation">
      <style>
        .serif { font-family:'Source Serif 4', Georgia, 'Times New Roman', serif; font-weight:700 }
        .sans { font-family:Manrope, 'Helvetica Neue', Arial, sans-serif; font-weight:700 }
        #quote text, #h1, #h2, #h3 { paint-order:stroke;stroke:#0e0d0c;stroke-width:12px;stroke-linejoin:round }
      </style>
      <defs>
        <radialGradient id="bgGlow" cx="50%" cy="56%" r="58%">
          <stop offset="0" stop-color="#2a2622"/>
          <stop offset="1" stop-color="#0e0d0c"/>
        </radialGradient>
        <filter id="og" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="5" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="halo" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
      </defs>
      <rect width="1920" height="1080" fill="#0e0d0c"/>
      <rect width="1920" height="1080" fill="url(#bgGlow)" opacity=".55"/>
      <g id="terrain" fill="none" stroke-linecap="round" stroke-linejoin="round"></g>
      <g id="dots" fill="#d9d2c9"></g>
      <g id="walker" fill="#d97757" filter="url(#og)"></g>
      <path id="arc" fill="none" stroke="#ff6a1f" stroke-width="5" stroke-dasharray="20 15" stroke-linecap="round" filter="url(#og)"/>
      <circle id="arcHead" r="6" fill="#ff6a1f"/>
      <g id="labels"></g>
      <g id="quote" class="serif" text-anchor="middle">
        <text x="960" y="438" font-size="66" fill="#f2ece4">Let the model work</text>
        <text x="960" y="518" font-size="66" fill="#f2ece4">at a <tspan fill="#ff6a1f">higher abstraction</tspan></text>
        <text x="960" y="584" font-size="30" fill="#a6a098" class="sans" style="font-weight:600">after an idea by Felix Rieseberg</text>
      </g>
      <g class="serif" text-anchor="middle" font-size="76" fill="#f2ece4">
        <text id="h1" x="960" y="142">A task is often just your best guess</text>
        <text id="h2" x="960" y="142">Ask for the goal</text>
        <text id="h3" x="960" y="142">Better still: the company objective</text>
      </g>
      <rect id="fadeB" width="1920" height="1080" fill="#0e0d0c"/>
      <g id="title">
        <rect width="1920" height="1080" fill="#0e0d0c"/>
        <rect width="1920" height="1080" fill="url(#bgGlow)" opacity=".55"/>
        <text id="titleWord" class="serif" x="960" y="462" font-size="168" text-anchor="middle" fill="#f2ece4">Altitude</text>
        <g id="titleRings" fill="none" stroke="#d9d2c9" stroke-width="3"></g>
        <circle id="titleGlow" r="22" fill="#ff6a1f" opacity=".25"/>
        <circle id="titleDot" r="9" fill="#ff6a1f"/>
        <rect id="fadeA" width="1920" height="1080" fill="#0e0d0c"/>
      </g>
    </svg>
  </div>
  <div class="bar">
    <button id="play" type="button">Pause</button>
    <input id="scrub" type="range" min="0" max="22" step="0.01" value="0" aria-label="Playback position">
    <span id="time">0.0 / 22.0 s</span>
    <button id="save" type="button">Save frame as SVG</button>
  </div>
</main>
<script>
(function () {
  const NS = 'http://www.w3.org/2000/svg', DUR = 22, T2 = 2.8;
  const clamp01 = x => Math.min(1, Math.max(0, x));
  const seg = (t, a, b) => clamp01((t - a) / (b - a));
  const lerp = (a, b, p) => a + (b - a) * p;
  const eo = x => 1 - Math.pow(1 - x, 3), ei = x => x * x * x;
  const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  function rng(s) { let a = s >>> 0; return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const mk = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const $ = id => document.getElementById(id);

  // ---------- world ----------
  const F = 1150;
  const K = [
    { t: 2.0, tx: -60, ty: 0, tz: 250, d: 2700, yaw: -0.22, pitch: 1.30 },
    { t: 7.8, tx: -150, ty: 70, tz: 80, d: 1550, yaw: -0.05, pitch: 0.40 },
    { t: 11.6, tx: -160, ty: 70, tz: 20, d: 1250, yaw: 0.04, pitch: 0.36 },
    { t: 15.0, tx: 200, ty: 250, tz: 440, d: 2750, yaw: -0.36, pitch: 0.36 },
    { t: 19.2, tx: 210, ty: 250, tz: 460, d: 2620, yaw: -0.40, pitch: 0.37 }];
  const HILLS = [
    { id: 'o', x: -120, z: 0, h: 150, r: 260, n: 11, seed: 3, fade: 1 },
    { id: 'm', x: 520, z: 900, h: 540, r: 620, n: 26, seed: 7, fade: 1 },
    { id: 'w', x: -950, z: 520, h: 120, r: 520, n: 9, seed: 11, fade: 0.9 },
    { id: 'f', x: -350, z: 2100, h: 260, r: 620, n: 14, seed: 5, fade: 0.55 }];
  const TASK = [-253, 0, -177], OUT = [-120, 150, 0], TOP = [520, 560, 900];
  const PATH = [[-900, -700], [-760, -610], [-640, -560], [-560, -450], [-470, -380], [-380, -330], [-310, -262], [-292, -205]];
  // The climber is Claude: the Claude Code mascot (coral body, two square eyes, arms out, four legs), as in filmkit.js.
  const BODY = ['001111111100', '001101101100', '111111111111', '111111111111', '001111111100'];
  const LEGS = [['001010010100', '001010010100'], ['000101101000', '001010010100']];
  const MAIN = [217, 210, 201], ACC = [255, 106, 31];
  const mix = k => [0, 1, 2].map(i => Math.round(lerp(MAIN[i], ACC[i], k)));

  function cam(t) {
    let a = K[0], b = K[0], p = 0;
    if (t > K[0].t && t < K[K.length - 1].t) {
      for (let i = 0; i < K.length - 1; i++) if (t >= K[i].t && t <= K[i + 1].t) { a = K[i]; b = K[i + 1]; const s = seg(t, a.t, b.t); p = i === 3 ? (s + eio(s)) / 2 : eio(s); break; }
    } else if (t >= K[K.length - 1].t) a = b = K[K.length - 1];
    const c = {}; for (const k of ['tx', 'ty', 'tz', 'd', 'yaw', 'pitch']) c[k] = lerp(a[k], b[k], p);
    c.yaw += 0.004 * t; c.d -= 6 * t;
    const cy = Math.cos(c.yaw), sy = Math.sin(c.yaw), cp = Math.cos(c.pitch), sp = Math.sin(c.pitch);
    c.F = [sy * cp, -sp, cy * cp]; c.R = [cy, 0, -sy]; c.U = [sy * sp, cp, cy * sp];
    c.C = [c.tx - c.d * c.F[0], c.ty - c.d * c.F[1], c.tz - c.d * c.F[2]];
    return c;
  }
  function proj(c, x, y, z, o) {
    const vx = x - c.C[0], vy = y - c.C[1], vz = z - c.C[2];
    const zc = vx * c.F[0] + vy * c.F[1] + vz * c.F[2];
    o[0] = 960 + F * (vx * c.R[0] + vz * c.R[2]) / zc;
    o[1] = 540 - F * (vx * c.U[0] + vy * c.U[1] + vz * c.U[2]) / zc;
    o[2] = zc; return o;
  }
  function ring(cx, cz, y, rad, wob, ph, sx, sz) {
    const N = 72, a = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) {
      const th = i / N * Math.PI * 2;
      const rr = rad * (1 + wob * (0.55 * Math.sin(2 * th + ph[0]) + 0.3 * Math.sin(3 * th + ph[1]) + 0.18 * Math.sin(5 * th + ph[2])));
      a[i * 3] = cx + Math.cos(th) * rr * sx; a[i * 3 + 1] = y; a[i * 3 + 2] = cz + Math.sin(th) * rr * sz;
    }
    return a;
  }
  function curve(pts, per) {
    const out = [];
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
      for (let j = 0; j < per; j++) {
        const s = j / per, s2 = s * s, s3 = s2 * s;
        out.push([0, 1].map(k => 0.5 * (2 * p1[k] + (-p0[k] + p2[k]) * s + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * s2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * s3)));
      }
    }
    out.push(pts[pts.length - 1].slice());
    const len = [0];
    for (let i = 1; i < out.length; i++) len.push(len[i - 1] + Math.hypot(out[i][0] - out[i - 1][0], out[i][1] - out[i - 1][1]));
    return { pts: out, len, total: len[len.length - 1] };
  }
  function along(path, s) {
    const L = path.len; let i = 1;
    while (i < L.length - 1 && L[i] < s) i++;
    const p = clamp01((s - L[i - 1]) / ((L[i] - L[i - 1]) || 1));
    return [lerp(path.pts[i - 1][0], path.pts[i][0], p), lerp(path.pts[i - 1][1], path.pts[i][1], p)];
  }

  // ---------- build terrain lines ----------
  const lines = [];
  HILLS.forEach(H => {
    const r = rng(H.seed); const ph = [r() * 6.3, r() * 6.3, r() * 6.3]; const lean = r() * 6.3;
    for (let i = 0; i < H.n; i++) {
      const qv = 0.05 + 0.935 * i / (H.n - 1);
      const cx = H.x + Math.cos(lean) * H.r * 0.07 * qv, cz = H.z + Math.sin(lean) * H.r * 0.07 * qv;
      lines.push({ pts: ring(cx, cz, qv * H.h, H.r * Math.sqrt(Math.log(qv) / Math.log(0.05)), 0.11 * (1 - 0.6 * qv), ph, 1, 1), closed: true, fade: H.fade, hill: H.id, ring: i });
    }
    const tq = 0.985, tx = H.x + Math.cos(lean) * H.r * 0.07 * tq, tz = H.z + Math.sin(lean) * H.r * 0.07 * tq;
    if (H.id === 'o') { OUT[0] = tx; OUT[1] = H.h * tq; OUT[2] = tz; }
    if (H.id === 'm') { TOP[0] = tx; TOP[1] = H.h * tq; TOP[2] = tz; }
    if (H.id !== 'f') [1.14, 1.34, 1.6].forEach((m, j) => {
      lines.push({ pts: ring(H.x, H.z, 0, H.r * m, 0.16 + j * 0.05, [ph[0] + j * 0.7, ph[1] - j * 0.9, ph[2] + j * 1.3], 1.05, 0.95), closed: true, fade: H.fade * 0.85 });
    });
  });
  const rr = rng(21);
  for (let n = 0; n < 70 && lines.length < 140; n++) {
    const x = lerp(-2600, 2600, rr()), z = lerp(-1100, 3400, rr()), rad = 45 + rr() * 170;
    const sx = 0.7 + rr() * 0.7, ph = [rr() * 6.3, rr() * 6.3, rr() * 6.3], k = 1 + Math.floor(rr() * 3);
    if (HILLS.some(H => Math.hypot(x - H.x, z - H.z) < H.r * 1.6 + rad)) continue;
    if (Math.hypot(x + 520, z + 420) < 330) continue;
    for (let j = 0; j < k; j++) lines.push({ pts: ring(x, z, 0, rad * (1 - j * 0.3), 0.26, ph, sx, 2 - sx), closed: true, fade: 0.8 });
  }
  for (let i = 0; i < 7; i++) {
    const ph = rr() * 6.3, ph2 = rr() * 6.3, z0 = -900 + i * 620 + rr() * 200; let cur = [];
    for (let x = -3000; x <= 3000; x += 70) {
      const z = z0 + 130 * Math.sin(x / 420 + ph) + 55 * Math.sin(x / 160 + ph2);
      if (HILLS.some(H => Math.hypot(x - H.x, z - H.z) < H.r * 1.75)) { if (cur.length > 3) lines.push({ pts: new Float32Array(cur), closed: false, fade: 0.7 }); cur = []; }
      else cur.push(x, 0, z);
    }
    if (cur.length > 3) lines.push({ pts: new Float32Array(cur), closed: false, fade: 0.7 });
  }
  const terrain = $('terrain');
  lines.forEach(L => { L.el = mk('path', {}, terrain); L.glow = false; });

  const walkPath = curve(PATH, 12);
  const dots = [];
  for (let s = 0; s < walkPath.total; s += 24) dots.push({ s, el: mk('circle', { r: 2 }, $('dots')) });
  const pix = [];
  for (let r = 0; r < 7; r++) for (let q = 0; q < 12; q++) pix.push({ r, q, el: mk('rect', {}, $('walker')) });

  // labels
  const labelsG = $('labels'), labels = {};
  [['task', 'the task', 86], ['out', 'the goal', 120], ['goal', 'the company objective', 112]].forEach(([k, txt, len]) => {
    const g = mk('g', {}, labelsG);
    const lead = mk('line', { 'stroke-width': 2, 'stroke-linecap': 'round' }, g);
    const pin = mk('ellipse', { rx: 7, ry: 4 }, g);
    const halo = mk('rect', { rx: 16, fill: 'none', stroke: '#ff6a1f', 'stroke-width': 6, filter: 'url(#halo)' }, g);
    const box = mk('rect', { rx: 16, fill: '#252321', 'stroke-width': 2 }, g);
    const text = mk('text', { class: 'sans', 'font-size': 30, fill: '#f2ece4', 'text-anchor': 'middle' }, g);
    text.textContent = txt;
    labels[k] = { g, lead, pin, halo, box, text, len, w: 220, h: 56 };
  });
  function measure() { for (const k in labels) { const L = labels[k]; if (!L.wr) L.w = Math.round(30 * L.text.textContent.length * 0.55 + 48); try { const n = L.text.getComputedTextLength(); if (n > 0) { L.w = n + 48; L.wr = 1; } } catch (e) {} } }
  addEventListener('resize', () => { measure(); try { render(now); } catch (e) {} });

  // title rings
  const TR = [[150, 26, 770], [112, 20, 734], [76, 14, 701], [40, 8, 672]];
  const titleRings = TR.map(r => mk('ellipse', { cx: 960, cy: r[2], rx: r[0], ry: r[1], pathLength: 100, 'stroke-dasharray': '100 100' }, $('titleRings')));

  // ---------- render ----------
  const P = [0, 0, 0];
  const fx = n => n.toFixed(1);
  function renderTitle(t) {
    $('title').style.display = t < T2 ? '' : 'none';
    if (t >= T2) return;
    $('titleWord').setAttribute('transform', 'translate(0 ' + fx(lerp(6, -4, seg(t, 0, 2.8))) + ')');
    $('titleWord').setAttribute('opacity', 0.85 + 0.15 * eo(seg(t, 0, 0.4)));
    titleRings.forEach((el, i) => { const p = eio(seg(t, 0.05 + i * 0.16, 0.6 + i * 0.16)); el.setAttribute('stroke-dashoffset', 100 - 100 * p); el.setAttribute('opacity', 0.35 + 0.65 * p); });
    const p = eio(seg(t, 0.9, 2.0)), y = lerp(796, 662, p), x = 960 + Math.sin(p * Math.PI * 1.5) * lerp(70, 0, p), v = eo(seg(t, 0.7, 1.0));
    for (const id of ['titleDot', 'titleGlow']) { $(id).setAttribute('cx', fx(x)); $(id).setAttribute('cy', fx(y)); }
    $('titleDot').setAttribute('opacity', v); $('titleGlow').setAttribute('opacity', 0.25 * v);
    $('titleGlow').setAttribute('r', fx(18 + 6 * eo(seg(t, 1.9, 2.3))));
    $('fadeA').setAttribute('opacity', ei(seg(t, 2.2, 2.8)));
  }
  function renderClimb(t) {
    const c = cam(t), A = eio(seg(t, 2.2, 3.8));
    const kO = i => eio(seg(t, 9.8 + i * 0.13, 10.25 + i * 0.13)) * (1 - eio(seg(t, 11.9, 12.9)));
    const kM = i => eio(seg(t, 13.0 + i * 0.075, 13.45 + i * 0.075));
    terrain.style.display = A > 0.001 ? '' : 'none';
    if (A > 0.001) for (const L of lines) {
      const pts = L.pts, n = pts.length / 3, k = L.hill === 'o' ? kO(L.ring) : L.hill === 'm' ? kM(L.ring) : 0;
      let d = '', pen = false, zs = 0, zn = 0;
      for (let i = 0; i <= n; i++) {
        if (i === n && !L.closed) break;
        const j = (i % n) * 3; proj(c, pts[j], pts[j + 1], pts[j + 2], P);
        if (P[2] < 60 || P[0] < -800 || P[0] > 2720) { pen = false; continue; }
        zs += P[2]; zn++;
        d += (pen ? 'L' : 'M') + fx(P[0]) + ' ' + fx(P[1]); pen = true;
      }
      L.el.setAttribute('d', d || 'M0 0');
      if (!zn) { L.el.setAttribute('stroke-opacity', 0); continue; }
      const da = Math.min(0.95, Math.max(0.16, 1.2 - (zs / zn - 700) / 3400)), col = mix(k);
      L.el.setAttribute('stroke', 'rgb(' + col.join(',') + ')');
      L.el.setAttribute('stroke-opacity', (lerp(da * L.fade * 0.85, 1, k) * A).toFixed(3));
      L.el.setAttribute('stroke-width', lerp(2.0, 2.8, k).toFixed(2));
      const g = k > 0.02; if (g !== L.glow) { L.glow = g; if (g) L.el.setAttribute('filter', 'url(#og)'); else L.el.removeAttribute('filter'); }
    }
    // walker and dotted path
    const wp = seg(t, 6.0, 9.0), sNow = walkPath.total * (wp * wp * (3 - 2 * wp) * 0.35 + wp * 0.65), wv = eo(seg(t, 5.9, 6.2)) * A;
    $('dots').setAttribute('opacity', (0.9 * wv).toFixed(3));
    for (const D of dots) {
      if (wv <= 0 || D.s >= sNow - 30) { D.el.setAttribute('r', 0); continue; }
      const g = along(walkPath, D.s); proj(c, g[0], 0, g[1], P);
      if (P[2] < 60) { D.el.setAttribute('r', 0); continue; }
      D.el.setAttribute('cx', fx(P[0])); D.el.setAttribute('cy', fx(P[1])); D.el.setAttribute('r', Math.max(1.6, 2600 / P[2]).toFixed(2));
    }
    const wg = along(walkPath, sNow); proj(c, wg[0], 0, wg[1], P);
    const walker = $('walker');
    if (wv > 0 && P[2] > 60) {
      walker.style.display = ''; walker.setAttribute('opacity', wv.toFixed(3));
      const ps = 8.5 * F / P[2], fr = t > 6.0 && t < 9.0 ? Math.floor(t * 4) % 2 : 0, rows = BODY.concat(LEGS[fr]);
      const bob = fr ? -ps * 0.5 : Math.sin(t * 2.4) * ps * 0.15, x0 = P[0] - ps * 6, y0 = P[1] - ps * rows.length + bob;
      for (const px of pix) {
        if (rows[px.r][px.q] !== '1') { px.el.setAttribute('width', 0); continue; }
        px.el.setAttribute('x', fx(x0 + px.q * ps)); px.el.setAttribute('y', fx(y0 + px.r * ps));
        px.el.setAttribute('width', (ps + 0.6).toFixed(2)); px.el.setAttribute('height', (ps + 0.6).toFixed(2));
      }
    } else walker.style.display = 'none';
    // arc
    const au = eio(seg(t, 15.2, 16.6));
    if (au > 0) {
      const mid = [(OUT[0] + TOP[0]) / 2, (OUT[1] + TOP[1]) / 2 + 340, (OUT[2] + TOP[2]) / 2];
      let d = ''; const N = 80, end = Math.round(N * au);
      for (let i = 0; i <= end; i++) {
        const s = i / N, u = 1 - s;
        proj(c, u * u * OUT[0] + 2 * u * s * mid[0] + s * s * TOP[0], u * u * OUT[1] + 2 * u * s * mid[1] + s * s * TOP[1], u * u * OUT[2] + 2 * u * s * mid[2] + s * s * TOP[2], P);
        d += (i ? 'L' : 'M') + fx(P[0]) + ' ' + fx(P[1]);
      }
      $('arc').setAttribute('d', d); $('arc').style.display = '';
      $('arcHead').setAttribute('cx', fx(P[0])); $('arcHead').setAttribute('cy', fx(P[1])); $('arcHead').style.display = au < 1 ? '' : 'none';
    } else { $('arc').style.display = 'none'; $('arcHead').style.display = 'none'; }
    // labels
    const place = (k, pt, grow, show, drop, aimK) => {
      const L = labels[k]; proj(c, pt[0], pt[1], pt[2], P);
      if (P[2] < 60 || (grow <= 0 && show <= 0)) { L.g.style.display = 'none'; return; }
      L.g.style.display = '';
      const x = P[0], y = P[1] - drop, len = L.len, m = mix(aimK), col = 'rgb(' + m.join(',') + ')';
      L.pin.setAttribute('cx', fx(x)); L.pin.setAttribute('cy', fx(y)); L.pin.setAttribute('opacity', Math.min(1, grow * 3));
      L.pin.setAttribute('fill', col);
      L.lead.setAttribute('x1', fx(x)); L.lead.setAttribute('x2', fx(x)); L.lead.setAttribute('y1', fx(y)); L.lead.setAttribute('y2', fx(y - len * grow));
      L.lead.setAttribute('stroke', col);
      const bx = x - L.w / 2, by = y - len - L.h + (1 - show) * 14;
      for (const r of [L.box, L.halo]) { r.setAttribute('x', fx(bx)); r.setAttribute('y', fx(by)); r.setAttribute('width', fx(L.w)); r.setAttribute('height', L.h); }
      const border = k === 'task' ? 'rgb(116,112,107)' : 'rgb(' + mix(aimK).map((v, i) => Math.round(lerp([116, 112, 107][i], v, aimK))).join(',') + ')';
      L.box.setAttribute('stroke', border); L.box.setAttribute('opacity', show.toFixed(3));
      L.halo.setAttribute('opacity', (show * aimK * 0.55).toFixed(3));
      L.text.setAttribute('x', fx(x)); L.text.setAttribute('y', fx(by + L.h / 2 + 10.5)); L.text.setAttribute('opacity', show.toFixed(3));
    };
    const dropP = eo(seg(t, 5.5, 6.05));
    place('task', TASK, eo(seg(t, 5.5, 5.75)), eo(seg(t, 5.75, 6.2)), (1 - dropP) * 90 - Math.sin(seg(t, 6.05, 6.35) * Math.PI) * 6, 0);
    place('out', OUT, eo(seg(t, 9.4, 9.9)), eo(seg(t, 9.75, 10.2)), 0, 1 - eio(seg(t, 11.9, 12.9)));
    place('goal', TOP, eo(seg(t, 14.9, 15.35)), eo(seg(t, 15.2, 15.6)), 0, 1);
    // quote and headlines
    const qIn = eo(seg(t, 0, 0.7)), qUp = eio(seg(t, 2.4, 3.8)), qOut = ei(seg(t, 5.0, 5.5));
    const q = $('quote'); q.setAttribute('opacity', (qIn * (1 - qOut)).toFixed(3));
    const dy = (1 - qIn) * 24 + lerp(0, -322, qUp) - qOut * 16, s = lerp(1, 0.8, qUp);
    q.setAttribute('transform', 'translate(960 ' + fx(380 + dy) + ') scale(' + s.toFixed(4) + ') translate(-960 -380)');
    [[5.9, 8.9], [9.4, 11.4], [12.6, 99]].forEach((H, i) => {
      const a = eo(seg(t, H[0], H[0] + 0.6)), b = ei(seg(t, H[1], H[1] + 0.4)), el = $('h' + (i + 1));
      el.setAttribute('opacity', (a * (1 - b)).toFixed(3));
      el.setAttribute('transform', 'translate(0 ' + fx((1 - a) * 24 - b * 16 - Math.max(0, t - H[0]) * 1.2) + ')');
    });
    $('fadeB').setAttribute('opacity', eio(seg(t, 18.4, 19.2)).toFixed(3));
  }
  function render(T) { renderTitle(T); renderClimb(Math.max(0, T - T2)); }

  // ---------- player ----------
  const QS = new URLSearchParams(location.search), FROM = +(QS.get('from') || 0);
  const DECK = document.documentElement.classList.contains('deck'), HOLD = QS.has('to') ? +QS.get('to') : 21.0; // deck: play once from 0, hold before the fade to black
  const WAIT = /[?&]wait/.test(location.search);   // the deck preloads the film on frame 0 and sends 'play'
  let now = FROM, playing = (DECK && !WAIT) || (!DECK && !matchMedia('(prefers-reduced-motion: reduce)').matches), last = null;
  addEventListener('message', e => { if (e.data === 'play') { measure(); now = FROM; playing = true; last = null; } if (e.data === 'end') { now = DECK ? HOLD : DUR; playing = false; show(); } });
  const playBtn = $('play'), scrub = $('scrub'), time = $('time');
  function show() { render(now); scrub.value = now; time.textContent = now.toFixed(1) + ' / ' + DUR.toFixed(1) + ' s'; playBtn.textContent = playing ? 'Pause' : 'Play'; }
  function tick(ts) {
    if (playing) { if (last !== null) now += (ts - last) / 1000; if (DECK && now >= HOLD) { now = HOLD; playing = false; } else if (now >= DUR) { now = DUR; playing = false; } }
    last = ts; show(); requestAnimationFrame(tick);
  }
  playBtn.addEventListener('click', () => { if (!playing && now >= DUR) now = 0; playing = !playing; last = null; show(); });
  scrub.addEventListener('input', () => { now = +scrub.value; show(); });
  document.addEventListener('keydown', e => {
    if (e.target === scrub) return;
    if (e.code === 'Space') { e.preventDefault(); playBtn.click(); }
    if (e.code === 'ArrowRight') { now = Math.min(DUR, now + 1 / 30); playing = false; show(); }
    if (e.code === 'ArrowLeft') { now = Math.max(0, now - 1 / 30); playing = false; show(); }
  });
  $('save').addEventListener('click', () => {
    const svg = $('film').cloneNode(true);
    svg.setAttribute('width', 1920); svg.setAttribute('height', 1080);
    const blob = new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(svg)], { type: 'image/svg+xml' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'altitude-' + now.toFixed(2) + 's.svg'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
  window.altitude = { seek(t) { now = t; playing = false; show(); }, render };
  window.DURATION = DECK ? HOLD : DUR; window.render = render; window.seek = window.altitude.seek;
  window.play = () => { if (now >= window.DURATION) now = 0; playing = true; last = null; }; window.pause = () => { playing = false; };
  measure(); show();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { measure(); show(); });
  requestAnimationFrame(tick);
})();
</script>

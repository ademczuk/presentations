<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Fight</title>
<link rel="stylesheet" href="fonts.css">
<script>if (/[?&]deck/.test(location.search)) document.documentElement.classList.add('deck');</script>
<style>
  :root { color-scheme: light dark; --page:#e9e6e1; --panel:#f6f4f1; --ink:#1d1b19; --muted:#6b665f; --line:#cfcac3; --accent:#ff6a1f; }
  @media (prefers-color-scheme: dark) { :root { --page:#141312; --panel:#1d1b19; --ink:#eeeae4; --muted:#9a948c; --line:#34312e; } }
  * { box-sizing:border-box }
  html, body { margin:0; background:var(--page); color:var(--ink); font-family:Manrope, system-ui, sans-serif }
  main { max-width:1280px; margin:0 auto; padding:24px 20px 32px }
  .frame { border-radius:10px; overflow:hidden; background:#0b0d12; box-shadow:0 10px 30px rgba(0,0,0,.25) }
  #film { display:block; width:100%; height:auto; aspect-ratio:16/9 }
  .bar { display:flex; align-items:center; gap:14px; margin-top:14px; padding:10px 14px; background:var(--panel); border:1px solid var(--line); border-radius:10px }
  button { font:inherit; font-weight:600; font-size:14px; color:var(--ink); background:transparent; border:1px solid var(--line); border-radius:8px; padding:8px 14px; cursor:pointer }
  button:hover { border-color:var(--muted) }
  button:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:2px }
  #play { min-width:76px }
  input[type=range] { flex:1; accent-color:var(--accent); min-width:80px }
  #time { font-variant-numeric:tabular-nums; font-size:14px; color:var(--muted); min-width:92px; text-align:right }
  html.deck, html.deck body { background:#0b0d12; overflow:hidden }
  html.deck main { max-width:none; padding:0 }
  html.deck .bar { display:none }
  html.deck .frame { border-radius:0; box-shadow:none; background:#0b0d12 }
  html.deck #film { width:100vw; height:100vh; aspect-ratio:auto }
  @media (max-width:640px) { .bar { flex-wrap:wrap } input[type=range] { order:3; flex-basis:100% } }
</style>
</head>
<body>
<main>
  <div class="frame">
    <svg id="film" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The Fight: orange Claude figures hold the slope against the purple horde with tools that refuse, a gate that pushes a message back, a rope between a writer and a reviewer, a lantern that shows how old the map is, and a carrier that waits for a signed yes">
      <style>
        .serif { font-family:'Source Serif 4', Georgia, 'Times New Roman', serif; font-weight:700 }
        .sans { font-family:Manrope, 'Helvetica Neue', Arial, sans-serif; font-weight:700 }
        .cap text { paint-order:stroke;stroke:#0b0d12;stroke-width:12px;stroke-linejoin:round }
        .kicker { letter-spacing:6px }
      </style>
      <defs>
        <radialGradient id="sky" cx="50%" cy="30%" r="75%">
          <stop offset="0" stop-color="#1a2232"/>
          <stop offset="1" stop-color="#0b0d12"/>
        </radialGradient>
        <filter id="og" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="4" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="halo" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
        <radialGradient id="flashG" cx="50%" cy="50%" r="50%">
          <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
          <stop offset=".5" stop-color="#ffe7a3" stop-opacity=".35"/>
          <stop offset="1" stop-color="#ffe7a3" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <rect width="1920" height="1080" fill="#0b0d12"/>
      <rect width="1920" height="1080" fill="url(#sky)"/>
      <g id="stars"></g>
      <g id="world">
        <g id="skyMask"></g>
        <g id="terrain" fill="none" stroke-linecap="round" stroke-linejoin="round"></g>
        <g id="lamp"></g>
        <g id="arch" fill="none" stroke="#ff6a1f" stroke-linecap="round" stroke-linejoin="round">
          <path id="archGlow" filter="url(#og)" opacity=".55"/>
          <path id="archPath"/>
        </g>
        <path id="slot" fill="#0b0d12" fill-opacity=".55" stroke="#c9ced6" stroke-width="3" stroke-dasharray="9 7"/>
        <g id="flag"><line id="pole" stroke="#f2ece4" stroke-width="4" stroke-linecap="round"/><path id="pennant" fill="#ff6a1f" filter="url(#og)"/></g>
        <g id="team"></g>
        <path id="rope" fill="none" stroke="#ff6a1f" stroke-width="4" stroke-dasharray="14 9" stroke-linecap="round"/>
        <g id="ropeFx"></g>
        <g id="gate">
          <path id="gateGlow" fill="#ff6a1f" filter="url(#og)" opacity=".5"/>
          <path id="gatePosts" fill="#ff6a1f" stroke="#7a2e08" stroke-width="1.5"/>
          <path id="gateFlash" fill="#ffffff" opacity="0"/>
        </g>
        <g id="dust" fill="#c8bba3"></g>
        <g id="keeper"></g>
        <g id="monsters"></g>
        <g id="props"></g>
        <ellipse id="flash" rx="0" ry="0" fill="url(#flashG)" opacity="0"/>
        <g id="labels"></g>
      </g>
      <g id="cap1" class="cap" text-anchor="middle">
        <text id="k1" class="sans kicker" x="960" y="80" font-size="26" fill="#ff6a1f">A GATE THAT REFUSES</text>
        <text id="h1" class="serif" x="960" y="142" font-size="68" fill="#f2ece4">Refused, not flagged.</text>
        <text id="s1" class="sans" style="font-weight:600" x="960" y="198" font-size="40" fill="#c9ced6">Built after a refusal was printed and the post went out anyway.</text>
      </g>
      <g id="cap2" class="cap" text-anchor="middle">
        <text id="k2" class="sans kicker" x="960" y="80" font-size="26" fill="#ff6a1f">A ROPE BETWEEN TWO CLIMBERS</text>
        <text id="h2" class="serif" x="960" y="142" font-size="66" fill="#f2ece4">One writer. A different reviewer. Every change.</text>
        <text id="s2" class="sans" style="font-weight:600" x="960" y="198" font-size="40" fill="#c9ced6">On that change, a second reviewer caught a new defect every time.</text>
      </g>
      <g id="cap3" class="cap" text-anchor="middle">
        <text id="k3" class="sans kicker" x="960" y="80" font-size="26" fill="#ff6a1f">AN INDEX WITH A DATE ON IT</text>
        <text id="h3" class="serif" x="960" y="142" font-size="68" fill="#f2ece4">A map that says how old it is.</text>
        <text id="s3" class="sans" style="font-weight:600" x="960" y="198" font-size="40" fill="#c9ced6">One index was 67 commits behind the code.</text>
      </g>
      <g id="cap4" class="cap" text-anchor="middle">
        <text id="h4" class="serif" x="960" y="142" font-size="76" fill="#f2ece4">Tools that refuse, not warn.</text>
        <text id="s4" class="sans" style="font-weight:600" x="960" y="204" font-size="40" fill="#c9ced6">And a map that says how old it is.</text>
      </g>
      <rect id="fade" width="1920" height="1080" fill="#0b0d12"/>
    </svg>
  </div>
  <div class="bar">
    <button id="play" type="button">Pause</button>
    <input id="scrub" type="range" min="0" max="33" step="0.01" value="0" aria-label="Playback position">
    <span id="time">0.0 / 33.0 s</span>
    <button id="save" type="button">Save frame as SVG</button>
  </div>
</main>
<script src="filmkit.js"></script>
<script>
(function () {
  const K = FilmKit, $ = K.$, seg = K.seg, lerp = K.lerp, eo = K.eo, ei = K.ei, eio = K.eio, fx = K.fx, c01 = K.clamp01;
  // Four beats. The deck stops on each: ?deck&from=0&to=8, ?from=8&to=16, ?from=16&to=24, ?from=24&to=32.
  // A camera key sits exactly on every from time and every move has settled at least 0.8 s before each hold.
  // Nothing is eliminated in this scene: the tools push the horde back or keep it out (ledger W1 to W5).
  const DUR = 33, HOLD = 32, B1 = 8, B2 = 16, B3 = 24;
  const H3_VERSIONS = null; // set on the day from the ledger; this scene shows no version count
  const CREAM = '#ffe7a3', GOLD = '#ffd36b', WOOD = '#c9b27a';

  // ---------- world layout: a path up the main mountain's camera-facing slope (s = 0 foot, s = 1 top) ----------
  // Laid out as a slope (s, side), then placed in Altitude's world: s = PIV_S sits on Altitude's task point and
  // the path runs from the task over the outcome hill toward the summit, as in the horde scene.
  const FOOT = [160, 330], TOPP = [470, 840];
  const TASK = [-253, -177], PIV_S = 0.47, HO = K.HILLS.find(H => H.id === 'o');
  const PIV = [lerp(FOOT[0], TOPP[0], PIV_S), lerp(FOOT[1], TOPP[1], PIV_S)];
  const ROT = Math.atan2(HO.x - TASK[0], HO.z - TASK[1]) - Math.atan2(TOPP[0] - FOOT[0], TOPP[1] - FOOT[1]);
  const CR = Math.cos(ROT), SR = Math.sin(ROT);
  const place = (x, z) => { const vx = x - PIV[0], vz = z - PIV[1]; return [TASK[0] + vx * CR + vz * SR, TASK[1] - vx * SR + vz * CR]; };
  const at = (s, side) => { const q = place(lerp(FOOT[0], TOPP[0], s) + side, lerp(FOOT[1], TOPP[1], s) - side * 0.35); return [q[0], K.groundY(q[0], q[1]), q[1]]; };
  // A camera key written for the slope layout, moved with it: the target is placed, its height kept above the
  // ground it now stands on, and the yaw turned by the same angle.
  const moveKey = v => { const q = place(v.tx, v.tz); return Object.assign({}, v, { tx: q[0], tz: q[1], ty: v.ty - K.groundY(v.tx, v.tz) + K.groundY(q[0], q[1]), yaw: v.yaw + ROT }); };
  const P = [0, 0, 0];
  const proj = w => { K.proj(cam, w[0], w[1], w[2], P); return [P[0], P[1], P[2]]; };
  const HERO = 11, MON = 8.8;         // world pixel size: the hero draws 1.25x the monsters
  const GATE_S = 0.2, HOLD_S = GATE_S - 0.2, POST_H = 150;
  const POSTS = []; for (let i = 0; i < 9; i++) POSTS.push({ side: -650 + i * 162.5, rank: Math.abs(i - 4) });
  const postLand = p => 1.95 + 0.04 * p.rank + 0.3;   // the mallet lands at 1.95; each post falls 0.3 s

  // ---------- camera keys ----------
  const K1 = { tx: 150, ty: 115, tz: 400, d: 1250, yaw: -0.86, pitch: 0.28 };
  const K1b = { tx: 160, ty: 110, tz: 400, d: 1160, yaw: -0.9, pitch: 0.28 };
  const K2 = { tx: 315, ty: 280, tz: 640, d: 760, yaw: -0.1, pitch: 0.36 };
  const K3 = { tx: -200, ty: 180, tz: 640, d: 1900, yaw: -0.22, pitch: 0.33 };
  const K4 = { tx: 395, ty: 170, tz: 510, d: 1350, yaw: -0.45, pitch: 0.34 };
  const key = (t, v) => Object.assign({ t }, moveKey(v));
  const KEYS = [key(0, K1), key(6.6, K1b), key(B1, K1b), key(9.8, K2), key(B2, K2), key(17.8, K3), key(B3, K3), key(26.2, K4), key(33, K4)];
  let cam = K.keyCamera(KEYS, 0);

  // ---------- builds ----------
  const stars = K.stars($('stars'), 150, 41, 520);
  const mask = K.skyMask($('skyMask'));
  const T = K.terrain($('terrain'));
  const HM = K.HILLS.find(H => H.id === 'm');
  T.lines.forEach(L => { if (L.hill === 'm') L.ring = Math.round((L.q - 0.05) / 0.935 * (HM.n - 1)); });
  const lantern = K.lantern($('lamp'));
  const r = K.rng(4401);

  // The team. The three bots of the horde's last beat (writer, reviewer, and the scene 1 hero with the lantern,
  // who stands at the top of the rope and is the named merger) plus the gatekeeper; in beat 4 a carrier arrives.
  const bot = () => K.sprite($('team'), { glow: true });
  const KEEP = { S: K.sprite($('keeper'), { glow: true }), ph: 0.4 };
  const WRITER = { S: bot(), ph: 1.3 }, REVIEWER = { S: bot(), ph: 2.1 }, BEARER = { S: bot(), ph: 0.0 }, CARRIER = { S: bot(), ph: 2.9 };
  const W_POS = [0.47, -220], R_POS = [0.47, 220], B_POS = [0.6, 40];
  const ARCH = [0.62, 380], SLOT = [0.62, 495], CAR_FROM = [0.7, 900], CAR_STOP = [0.62, 565];
  const W0 = [0.64, 330], R0 = [0.6, 190];   // the rope pair waits up the slope beside the bearer until beat 2

  // The horde: eight purple bodies, all on screen to the end; the gate keeps them below it.
  // A clump of two loose rows (side, row): front row nearest the gate.
  // Four loose files down the slope, two abreast: [side, s at rest]. The front file stands 0.23 below the gate.
  const HSPOT = [[-120, -0.03], [130, -0.03], [-30, -0.2], [210, -0.2], [-150, -0.37], [90, -0.37], [-40, -0.54], [190, -0.54]];
  const HORDE = HSPOT.map(([side, rs], i) => ({
    side: side + (r() - 0.5) * 30, rest: rs - r() * 0.02, start: rs - 0.28 - r() * 0.1,
    t0: 0.0 + r() * 0.5, t1: 2.3 + r() * 0.35, cad: 3.2 + r() * 1.2, ph: r() * 2, sway: r() * 6.3,
    flip: false, S: K.sprite($('monsters'), { outline: true }) }));
  const CARRY = HORDE[1];                     // the body that carries the post up to the gate
  // Bodies that press the gate are pushed back a step, never removed: [body, start time].
  const PRESSES = [[CARRY, 3.0], [HORDE[0], 6.0], [HORDE[0], 27.0], [HORDE[1], 27.6]];
  const PRESS_UP = 0.9, PRESS_BACK = 0.55;

  // Dust kicked up when each post lands: seeded once.
  const DUST = [];
  POSTS.forEach(p => { for (let k = 0; k < 8; k++) DUST.push({ p, ang: r() * 6.283, sp: 60 + r() * 90, up: 120 + r() * 160, sz: 3 + r() * 3, el: K.mk('rect', {}, $('dust')) }); });

  // Props.
  const mallet = K.mk('g', {}, $('keeper'));
  const malletHandle = K.mk('line', { stroke: WOOD, 'stroke-linecap': 'round' }, mallet);
  const malletHead = K.mk('rect', { fill: '#d9d2c9', stroke: '#0b0d12', 'stroke-width': 1.5 }, mallet);
  const env = K.mk('g', {}, $('props'));
  const envBody = K.mk('rect', { fill: '#f2ece4', stroke: '#0b0d12', 'stroke-width': 2 }, env);
  const envFlap = K.mk('path', { fill: 'none', stroke: '#6b665f', 'stroke-width': 2.5, 'stroke-linejoin': 'round' }, env);
  const box = K.mk('g', {}, $('team'));
  const boxBody = K.mk('rect', { fill: WOOD, stroke: '#0b0d12', 'stroke-width': 2 }, box);
  const boxTape = K.mk('rect', { fill: '#8a6f3a' }, box);
  const blocks = [0, 1, 2, 3].map(() => K.mk('rect', { fill: '#f2ece4', stroke: '#0b0d12', 'stroke-width': 2 }, $('ropeFx')));
  const marks = [0, 1, 2].map(() => K.mk('rect', { fill: K.RED }, $('ropeFx')));
  const sparks = [0, 1, 2, 3].map(() => K.mk('rect', { fill: K.RED }, $('ropeFx')));
  const check = K.mk('path', { fill: 'none', stroke: CREAM, 'stroke-width': 6, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', filter: 'url(#og)' }, $('ropeFx'));

  // Pills (Altitude's pinned construction), widths measured once the fonts are ready.
  const LB = $('labels');
  const L_post = K.label(LB, 'the post', { lift: 78 });
  const L_ref = K.label(LB, 'refused', { lift: 70 });
  const L_wr = K.label(LB, 'writes', { lift: 70 });
  const L_rv = K.label(LB, 'reviews', { lift: 70 });
  const L_mg = K.label(LB, 'merged: the reviewed version', { lift: 96 });
  const L_old = K.label(LB, '67 commits behind', { lift: 110 });
  const L_slot = K.label(LB, "waiting for this build's signed yes", { lift: 150 });
  const L_car = K.label(LB, 'live since 27 October, 0 builds carried', { lift: 70, size: 24, h: 46 });

  // A pill whose box is slid sideways from its leader, so two pins close together can carry two pills.
  // (Local: K.drawLabel always centers the pill on its pin.)
  function labelAt(L, x, y, px, grow, show, color) {
    K.drawLabel(L, x, y, grow, show, color);
    if (L.g.style.display === 'none') return;
    const bx = px - L.width / 2;
    for (const R of [L.box, L.halo]) R.setAttribute('x', fx(bx));
    L.text.setAttribute('x', fx(px));
  }

  // ---------- motion helpers (pure functions of t) ----------
  // A climber's walk frame and bob, with its own phase so nobody steps or breathes in sync.
  function pose(t, ps, moving, cad, ph) {
    const fr = moving ? Math.floor(t * cad + ph) % 2 : 0;
    const bob = fr ? -ps * 0.5 : Math.sin(t * 2.4 + ph) * ps * 0.15;
    return { fr, bob };
  }
  function drawBot(B, t, w, ps, op, moving, extra) {
    const q = pose(t, ps, moving, 4, B.ph);
    const o = Object.assign({ t: 0, phase: q.fr, cadence: 0, bob: false }, extra || {});
    K.drawSprite(B.S, 'climber', w[0], w[1] + q.bob, ps, K.ORANGE, op, o);
    return { x: w[0], y: w[1] + q.bob, foot: w[1], ps, z: w[2] };
  }
  // The keeper walks in, dips, raises the mallet, and brings it down; the posts fall from that moment.
  function keeperState(t) {
    const walk = eio(seg(t, 0.6, 1.4));
    const s = lerp(0.42, 0.27, walk), side = lerp(-160, 60, walk);
    const dip = Math.sin(Math.PI * seg(t, 1.45, 1.62)) * 0.1;
    const lift = eo(seg(t, 1.62, 1.88)) * (1 - ei(seg(t, 1.88, 1.96)));
    const scaleY = 1 - dip + 0.1 * lift + 0.06 * Math.sin(Math.PI * seg(t, 1.96, 2.2)) * -1;
    let ang = 120;                                     // degrees: the mallet hangs forward and down
    ang = lerp(ang, -55, eio(seg(t, 1.5, 1.88)));     // raised overhead
    ang = lerp(ang, 105, ei(seg(t, 1.88, 1.96)));     // and slammed down
    return { s, side, walking: t > 0.6 && t < 1.4, scaleY, ang };
  }
  // A horde body's place on the slope: walk up, settle at its rest line, press the gate and be pushed back.
  function hordeState(h, t) {
    const a = eio(seg(t, h.t0, h.t1));
    let s = lerp(h.start, h.rest, a), hop = 0, squash = 1, moving = t > h.t0 && t < h.t1, flash = 0;
    for (const [b, t0] of PRESSES) {
      if (b !== h) continue;
      const up = eio(seg(t, t0, t0 + PRESS_UP)), back = seg(t, t0 + PRESS_UP, t0 + PRESS_UP + PRESS_BACK);
      const contact = GATE_S - 0.03;
      s = lerp(s, contact, up * (1 - eo(back)));
      if (t > t0 && t < t0 + PRESS_UP) moving = true;
      hop += Math.sin(Math.PI * back) * 1;
      if (back > 0 && back < 1) { flash = Math.max(flash, 1 - seg(t, t0 + PRESS_UP, t0 + PRESS_UP + 0.18)); }
      squash *= 1 - 0.18 * Math.sin(Math.PI * seg(t, t0 + PRESS_UP + PRESS_BACK, t0 + PRESS_UP + PRESS_BACK + 0.25));
    }
    return { s, hop, squash, moving, flash };
  }
  // The rope's four versions: [leave writer, reach reviewer]. Three come back flagged; the fourth is checked.
  const VTIMES = [10.2, 11.35, 12.5, 13.65], VTRAVEL = 0.55, VBACK = 0.5;

  // ---------- render ----------
  function render(t) {
    cam = K.keyCamera(KEYS, t);
    const open = eo(seg(t, 0, 0.9));
    K.drawStars(stars, t, open);
    K.drawSkyMask(mask, T, cam, ['m', 'w', 'o', 'f'], '#0e121a');
    $('skyMask').setAttribute('opacity', open.toFixed(3));

    // ---- the lamp's light: rings of the main mountain warm one at a time outward from the bearer ----
    const lampUp = eio(seg(t, 16.5, 16.9)) * (1 - eio(seg(t, B3, B3 + 0.7)));
    const lampOn = 0.45 + 0.55 * eo(seg(t, 16.75, 17.1)) * (1 - eio(seg(t, B3, B3 + 1.0)));
    const bw = at(B_POS[0], B_POS[1]), ringB = Math.round((bw[1] / HM.h - 0.05) / 0.935 * (HM.n - 1));
    const cool = 1 - eio(seg(t, B3, B3 + 1.2));
    const warmK = L => {
      if (L.hill !== 'm') return 0;
      const dd = Math.abs(L.ring - ringB); if (dd > 3) return 0;
      const a = 17.0 + 0.2 * dd;
      return eio(seg(t, a, a + 0.3)) * (1 - 0.18 * dd) * cool;
    };
    const stale = eio(seg(t, 17.3, 18.1)) * cool;
    K.drawTerrain(T, cam, open, L => {
      const k = warmK(L);
      if (k > 0) { const col = Math.abs(L.ring - ringB) <= 1 ? [255, 231, 163] : [255, 211, 107];
        return [Math.round(lerp(118, col[0], k)), Math.round(lerp(132, col[1], k)), Math.round(lerp(160, col[2], k)), 1 + 0.5 * k]; }
      if (L.hill === 'w') return [Math.round(lerp(118, 90, stale)), Math.round(lerp(132, 97, stale)), Math.round(lerp(160, 112, stale)), 1];
      return [118, 132, 160, 1];
    }, { nearFade: true });
    for (const L of T.lines) {
      const k = warmK(L);
      if (k > 0.02) { L.el.setAttribute('stroke-width', lerp(2, 3, k).toFixed(2)); if (!L.glow) { L.el.setAttribute('filter', 'url(#og)'); L.glow = 1; } }
      else if (L.glow) { L.el.removeAttribute('filter'); L.glow = 0; }
      if (L.hill === 'w') {
        if (stale > 0.01) { L.el.setAttribute('stroke-dasharray', '10 9');
          L.el.setAttribute('stroke-opacity', lerp(+L.el.getAttribute('stroke-opacity'), 0.45 * open, stale).toFixed(3)); }
        else L.el.removeAttribute('stroke-dasharray');
      }
    }

    // ---- the palisade: nine posts drop from above, staggered from the center out, then two crossbars ----
    const KS = keeperState(t);
    let posts = '', glow = '', flashD = '';
    const tops = [];
    const envHit = 3.0 + PRESS_UP;                        // the post meets the gate
    const hitFlash = 1 - seg(t, envHit, envHit + 0.35);
    POSTS.forEach((p, i) => {
      const t0 = postLand(p) - 0.3, f = seg(t, t0, t0 + 0.3), land = postLand(p);
      let off = (1 - ei(f)) * 220;                        // falls from above with ease-in

    // ---- captions ----
    K.fade($('k1'), t, 0.9, B1); K.fade($('h1'), t, 2.7, B1); K.fade($('s1'), t, envHit + 1.4, B1);
    K.fade($('k2'), t, B1 + 0.6, B2); K.fade($('h2'), t, B1 + 1.0, B2); K.fade($('s2'), t, 13.2, B2);
    K.fade($('k3'), t, B2 + 0.6, B3); K.fade($('h3'), t, B2 + 1.0, B3); K.fade($('s3'), t, 18.4, B3);
    K.fade($('h4'), t, B3 + 1.0, null); K.fade($('s4'), t, 29.2, null);
    $('fade').setAttribute('opacity', (1 - open + ei(seg(t, HOLD + 0.2, HOLD + 0.9))).toFixed(3));
  }
  function mixHex(a, b, k) {
    const pa = [1, 3, 5].map(i => parseInt(a.slice(i, i + 2), 16)), pb = [1, 3, 5].map(i => parseInt(b.slice(i, i + 2), 16));
    return 'rgb(' + pa.map((v, i) => Math.round(lerp(v, pb[i], k))).join(',') + ')';
  }
  K.player(DUR, HOLD, render, 'fight');
})();
</script>

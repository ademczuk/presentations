<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Film kit test</title>
<link rel="stylesheet" href="fonts.css">
<script>if (/[?&]deck/.test(location.search)) document.documentElement.classList.add('deck');</script>
<style>
  :root { color-scheme: light dark; --page:#e9e6e1; --panel:#f6f4f1; --ink:#1d1b19; --muted:#6b665f; --line:#cfcac3; --accent:#ff6a1f; }
  * { box-sizing:border-box } html,body { margin:0; background:var(--page); color:var(--ink); font-family:Manrope,system-ui,sans-serif }
  main { max-width:1280px; margin:0 auto; padding:24px 20px 32px }.frame { overflow:hidden; border-radius:10px; background:#0b0d12; box-shadow:0 10px 30px rgba(0,0,0,.25) }
  #film { display:block; width:100%; height:auto; aspect-ratio:16/9 }.bar { display:flex; align-items:center; gap:14px; margin-top:14px; padding:10px 14px; background:var(--panel); border:1px solid var(--line); border-radius:10px }
  button { font:inherit; font-weight:600; color:var(--ink); background:transparent; border:1px solid var(--line); border-radius:8px; padding:8px 14px } #play { min-width:76px } input[type=range] { flex:1; accent-color:var(--accent) } #time { min-width:92px; text-align:right; font-variant-numeric:tabular-nums; color:var(--muted) }
  html.deck,html.deck body { background:#0b0d12; overflow:hidden } html.deck main { max-width:none; padding:0 } html.deck .bar { display:none } html.deck .frame { border-radius:0; box-shadow:none } html.deck #film { width:100vw; height:100vh; aspect-ratio:auto }
</style>
</head>
<body>
<main><div class="frame">
<svg id="film" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Film kit feature test">
  <style>.serif{font-family:'Source Serif 4',Georgia,serif;font-weight:700}.sans{font-family:Manrope,Arial,sans-serif;font-weight:700}</style>
  <defs>
    <radialGradient id="sky" cx="50%" cy="30%" r="75%"><stop offset="0" stop-color="#1a2232"/><stop offset="1" stop-color="#0b0d12"/></radialGradient>
    <filter id="og" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="halo" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="#0b0d12"/><rect width="1920" height="1080" fill="url(#sky)"/>
  <g id="stars"></g><g id="skyMask"></g><g id="terrain"></g><g id="trail"></g><g id="actors"></g><g id="labels"></g>
  <text class="serif" x="960" y="116" text-anchor="middle" font-size="66" fill="#f2ece4">The film kit, under motion</text>
  <text class="sans" x="960" y="165" text-anchor="middle" font-size="24" fill="#c9ced6" letter-spacing="4">CAMERA, DEPTH, LIGHT, AND A PATH HOME</text>
</svg>
</div><div class="bar"><button id="play" type="button">Pause</button><input id="scrub" type="range" min="0" max="12" step="0.01" value="0" aria-label="Playback position"><span id="time">0.0 / 12.0 s</span><button id="save" type="button">Save frame as SVG</button></div></main>
<script src="filmkit.js"></script>
<script>
(function () {
  const K = FilmKit, $ = K.$, P = [0, 0, 0], DUR = 12;
  const keys = [
    { t:0, tx:280, ty:120, tz:620, d:2400, yaw:-.34, pitch:.34 },
    { t:4, tx:300, ty:95, tz:490, d:1550, yaw:-.24, pitch:.27 },
    { t:8, tx:235, ty:125, tz:570, d:1950, yaw:-.44, pitch:.31 },
    { t:12, tx:235, ty:125, tz:570, d:1950, yaw:-.44, pitch:.31 }
  ];
  const stars = K.stars($('stars'), 170, 41, 560), terrain = K.terrain($('terrain'));
  const mask = K.skyMask($('skyMask')), trail = K.trail($('trail'));
  const route = [[120,360],[225,480],[330,610],[430,760]];
  const cast = [
    { kind:'climber', x:205, z:430, color:K.ORANGE, phase:0, cadence:4, bob:true, glow:true, seed:11 },
    { kind:'blob', x:100, z:560, color:K.PURPLE, phase:1, cadence:2.6, bob:true, flip:true, seed:12 },
    { kind:'zombie', x:290, z:540, color:K.GREEN, phase:.35, cadence:3.2, bob:true, scaleY:.82, rot:-4, seed:13 },
    { kind:'mutant', x:385, z:650, color:K.RED, phase:.7, cadence:4.5, bob:true, flip:true, scaleY:1.12, rot:5, seed:14 },
    { kind:'zmutant', x:255, z:500, color:K.PURPLE, phase:.1, cadence:2, bob:true, seed:15, outline:true, dissolve:true }
  ];
  cast.forEach(a => { a.S = K.sprite($('actors'), { glow:a.glow, outline:a.outline }); });
  const lantern = K.lantern($('actors'));
  const grey = K.label($('labels'), 'a gray, pinned label', { lift:92 });
  const cream = K.label($('labels'), 'cream light reaches here', { lift:112 });
  function render(t) {
    const c = K.keyCamera(keys, t), open = K.eo(K.seg(t, 0, .8));
    K.drawStars(stars, t, open);
    K.drawSkyMask(mask, terrain, c, ['o','m','w','f'], '#0b0d12');
    K.drawTerrain(terrain, c, open, L => L.hill === 'm' ? [145,154,177,1] : [108,123,150,1], { nearFade:true });
    K.drawTrail(trail, c, route, K.eo(K.seg(t, .8, 7.4)));
    const order = [];
    cast.forEach((a, i) => {
      const y = K.groundY(a.x, a.z); K.proj(c, a.x, y, a.z, P);
      const ps = 8.2 * K.F / P[2], o = { t, phase:a.phase, cadence:a.cadence, bob:a.bob, flip:a.flip, scaleY:a.scaleY, rot:a.rot, seed:a.seed, outline:a.outline,
        dissolve:a.dissolve ? K.seg(t, 7.2, 11.2) : 0 };
      K.drawSprite(a.S, a.kind, P[0], P[1], ps, a.color, open, o); order.push({ g:a.S.g, z:P[2] });
      a.screen = [P[0],P[1],ps];
    });
    K.depthSort(order);
    const hero = cast[0].screen, light = K.eio(K.seg(t, 4.8, 6.1));
    K.drawLantern(lantern, hero[0] + hero[2] * 6.2, hero[1] - hero[2] * 7.5, hero[2], light, t);
    K.drawLabel(grey, cast[1].screen[0], cast[1].screen[1] - cast[1].screen[2] * 9, K.eo(K.seg(t, 2.1, 2.8)), K.eo(K.seg(t, 2.45, 3.1)), K.GREY);
    K.drawLabel(cream, cast[3].screen[0], cast[3].screen[1] - cast[3].screen[2] * 10, K.eo(K.seg(t, 5.8, 6.5)), K.eo(K.seg(t, 6.15, 6.8)), '#ffe7a3');
  }
  K.player(DUR, DUR, render, 'kit-test');
})();
</script>
</body>
</html>

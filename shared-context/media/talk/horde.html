<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Horde</title>
<link rel="stylesheet" href="fonts.css">
<script>if (/[?&]deck/.test(location.search)) document.documentElement.classList.add('deck');</script>
<style>
  :root { color-scheme: light dark; --page:#e9e6e1; --panel:#f6f4f1; --ink:#1d1b19; --muted:#6b665f; --line:#cfcac3; --accent:#3ddc84; }
  @media (prefers-color-scheme: dark) { :root { --page:#141312; --panel:#1d1b19; --ink:#eeeae4; --muted:#9a948c; --line:#34312e; } }
  * { box-sizing:border-box }
  html, body { margin:0; background:var(--page); color:var(--ink); font-family:Manrope, system-ui, sans-serif }
  main { max-width:1280px; margin:0 auto; padding:24px 20px 32px }
  .frame { border-radius:10px; overflow:hidden; background:#0b0d12; box-shadow:0 10px 30px rgba(0,0,0,.25) }
  #film { display:block; width:100%; height:auto; aspect-ratio:16/9 }
  .bar { display:flex; align-items:center; gap:14px; margin-top:14px; padding:10px 14px; background:var(--panel); border:1px solid var(--line); border-radius:10px }
  button { font:inherit; font-weight:600; font-size:14px; color:var(--ink); background:transparent; border:1px solid var(--line); border-radius:8px; padding:8px 14px; cursor:pointer }
  button:hover { border-color:var(--muted) }
  button:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:2px }
  #play { min-width:76px }
  input[type=range] { flex:1; accent-color:var(--accent); min-width:80px }
  #time { font-variant-numeric:tabular-nums; font-size:14px; color:var(--muted); min-width:92px; text-align:right }
  html.deck, html.deck body { background:#0b0d12; overflow:hidden }
  html.deck main { max-width:none; padding:0 }
  html.deck .bar { display:none }
  html.deck .frame { border-radius:0; box-shadow:none; background:#0b0d12 }
  html.deck #film { width:100vw; height:100vh; aspect-ratio:auto }
  @media (max-width:640px) { .bar { flex-wrap:wrap } input[type=range] { order:3; flex-basis:100% } }
</style>
</head>
<body>
<main>
  <div class="frame">
    <svg id="film" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The Horde: grey monsters climb the contour-map mountain after a green figure, in three beats: mutant processes, zombie threads and the horde">
      <style>
        .serif { font-family:'Source Serif 4', Georgia, 'Times New Roman', serif; font-weight:700 }
        .sans { font-family:Manrope, 'Helvetica Neue', Arial, sans-serif; font-weight:700 }
        .cap text, .tag { paint-order:stroke;stroke:#0b0d12;stroke-width:12px;stroke-linejoin:round }
        .kicker { letter-spacing:6px }
      </style>
      <defs>
        <radialGradient id="sky" cx="50%" cy="30%" r="75%">
          <stop offset="0" stop-color="#1a2232"/>
          <stop offset="1" stop-color="#0b0d12"/>
        </radialGradient>
        <filter id="og" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="4" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <rect width="1920" height="1080" fill="#0b0d12"/>
      <rect width="1920" height="1080" fill="url(#sky)"/>
      <g id="stars"></g>
      <g id="terrain" fill="none" stroke-linecap="round" stroke-linejoin="round"></g>
      <g id="monsters"></g>
      <g id="team" filter="url(#og)"></g>
      <g id="tags" class="sans" font-size="26" text-anchor="middle"></g>
      <g id="capA" class="cap" text-anchor="middle">
        <text class="sans kicker" x="960" y="92" font-size="26" fill="#8d949e">MUTANT PROCESSES</text>
        <text class="serif" x="960" y="168" font-size="60" fill="#f2ece4">One run of agents started 384 helpers.</text>
        <text class="serif" x="960" y="240" font-size="60" fill="#f2ece4">341 died on a shared limit before finishing,</text>
        <text class="serif" x="960" y="312" font-size="60" fill="#f2ece4">and the part that mattered never ran.</text>
      </g>
      <g id="capB" class="cap" text-anchor="middle">
        <text class="sans kicker" x="960" y="92" font-size="26" fill="#8d949e">ZOMBIE THREADS</text>
        <text class="serif" x="960" y="168" font-size="60" fill="#f2ece4">"Stopped," said the tool.</text>
        <text class="serif" x="960" y="240" font-size="60" fill="#f2ece4">The process was still running 947 minutes later,</text>
        <text class="serif" x="960" y="312" font-size="60" fill="#f2ece4">and two copies were writing the same file.</text>
      </g>
      <g id="capC" class="cap" text-anchor="middle">
        <text class="sans kicker" x="960" y="92" font-size="26" fill="#8d949e">THE HORDE</text>
        <text class="serif" x="960" y="168" font-size="56" fill="#f2ece4">Two agents built the same fix, 25 minutes apart.</text>
        <text class="serif" x="960" y="240" font-size="56" fill="#f2ece4">One change, seven versions in about three hours,</text>
        <text class="serif" x="960" y="312" font-size="56" fill="#f2ece4">and a second reviewer found a new real defect in every one.</text>
      </g>
      <g id="tally" class="sans" font-size="34" fill="#c9ced6" text-anchor="end">
        <text id="tally1" x="1840" y="1000"></text>
      </g>
      <rect id="fade" width="1920" height="1080" fill="#0b0d12"/>
    </svg>
  </div>
  <div class="bar">
    <button id="play" type="button">Pause</button>
    <input id="scrub" type="range" min="0" max="31" step="0.01" value="0" aria-label="Playback position">
    <span id="time">0.0 / 31.0 s</span>
    <button id="save" type="button">Save frame as SVG</button>
  </div>
</main>
<script src="filmkit.js"></script>
<script>
(function () {
  const K = FilmKit, $ = K.$;
  // Three beats. The deck stops on each: ?from=0&to=9, ?from=9&to=18.5, ?from=18.5&to=30.
  const DUR = 31, HOLD = 30, A0 = 0, A1 = 9, B1 = 18.5, C1 = 30;
  const VIEW = { tx: 330, ty: 170, tz: 600, d: 2350, yaw: -0.28, pitch: 0.27, dolly: 6, drift: 0.002 };
  const stars = K.stars($('stars'), 150, 41, 520);
  const T = K.terrain($('terrain'));
  // A path up the main mountain's camera-facing slope: s = 0 at its foot, s = 1 near the top.
  const FOOT = [160, 330], TOP = [470, 840];
  const at = (s, side) => { const x = K.lerp(FOOT[0], TOP[0], s) + side, z = K.lerp(FOOT[1], TOP[1], s) - side * 0.35; return [x, K.groundY(x, z), z]; };
  const P = [0, 0, 0];
  const r = K.rng(77);

  // Mutants: one splits to 32 on screen (standing for 384); 28 of them die (341 of 384 is 89%), 4 finish.
  const MUT = [];
  for (let i = 0; i < 32; i++) MUT.push({ s: 0.02 + r() * 0.16, side: (r() - 0.5) * 520, born: 1.4 + Math.floor(Math.log2(i + 1)) * 0.75 + r() * 0.2,
                                          dies: i % 8 !== 3, dieAt: 5.3 + r() * 1.6, S: K.sprite($('monsters')) });
  // Zombies: one walks up after it was told to stop; a copy joins it.
  const ZOM = [{ side: -30, S: K.sprite($('monsters')), from: 9.6 }, { side: 60, S: K.sprite($('monsters')), from: 13.6 }];
  // The horde: 36 climbers, blobs and zombies mixed, coming up from the foot.
  const HORDE = [];
  for (let i = 0; i < 36; i++) HORDE.push({ s0: -0.05 - r() * 0.3, side: (r() - 0.5) * 1100, cap: 0.26 + r() * 0.18, sp: 0.018 + r() * 0.016, kind: i % 3 ? 'blob' : 'zombie',
                                            from: 18.9 + r() * 4.5, S: K.sprite($('monsters')) });
  // The team: one green figure up the slope in beats A and B; three in beat C.
  const TEAM = [{ s: 0.5, side: 0 }, { s: 0.56, side: -110 }, { s: 0.6, side: 120 }].map(m => Object.assign(m, { S: K.sprite($('team')) }));
  const stopTag = K.mk('text', { class: 'tag', fill: '#c9ced6' }, $('tags'));
  const fileTag = K.mk('text', { class: 'tag', fill: '#c9ced6' }, $('tags'));

  function sprite(S, kind, w, ps, fill, op, fr) { K.drawSprite(S, kind, w[0], w[1], ps, fill, op, fr); }
  function place(c, wp) { K.proj(c, wp[0], wp[1], wp[2], P); return [P[0], P[1], P[2]]; }

  function render(t) {
    const c = K.camera(VIEW, t);
    const open = K.eo(K.seg(t, 0, 1.2));
    K.drawStars(stars, t, open);
    K.drawTerrain(T, c, open, () => [118, 132, 160, 1]);
    const walk = Math.floor(t * 4) % 2;

    // ---- the team (green) ----
    TEAM.forEach((m, i) => {
      const vis = i === 0 ? open : K.eo(K.seg(t, B1 + 0.3 + i * 0.4, B1 + 1.1 + i * 0.4));
      const s = m.s + (t > B1 ? 0.004 * (t - B1) : 0);
      const q = place(c, at(s, m.side));
      sprite(m.S, 'climber', q, 8.5 * K.F / q[2], K.GREEN, vis, walk);
    });

    // ---- beat A: mutants split, then most die ----
    let alive = 0, born = 0;
    MUT.forEach(m => {
      const b = K.seg(t, m.born, m.born + 0.35);
      if (b > 0) born++;
      const dead = m.dies ? K.seg(t, m.dieAt, m.dieAt + 0.7) : 0;
      if (b > 0 && dead < 1) alive++;
      const out = K.ei(K.seg(t, A1, A1 + 0.6));
      const w = place(c, at(m.s, m.side * K.eo(b)));
      w[1] += dead * 18;
      const fill = dead > 0 ? '#565b63' : K.GREY;
      sprite(m.S, 'blob', w, 7 * K.F / w[2] * (0.6 + 0.4 * K.eo(b)), fill, K.eo(b) * (1 - 0.75 * dead) * (1 - out), dead > 0 ? 0 : walk);
    });
    // ---- beat B: zombies keep walking after "stopped" ----
    ZOM.forEach((z, i) => {
      const vis = K.eo(K.seg(t, z.from, z.from + 0.6)) * (1 - K.ei(K.seg(t, B1, B1 + 0.6)));
      const s = 0.04 + 0.022 * Math.max(0, t - z.from);
      const w = place(c, at(s, z.side));
      sprite(z.S, 'zombie', w, 8 * K.F / w[2], K.GREY, vis, walk);
      if (i === 0) {
        stopTag.textContent = 'status: stopped';
        stopTag.setAttribute('x', K.fx(w[0])); stopTag.setAttribute('y', K.fx(w[1] - 8 * K.F / w[2] * 11));
        stopTag.setAttribute('opacity', (vis * K.eo(K.seg(t, 10.6, 11.2))).toFixed(3));
      }
      if (i === 1) {
        fileTag.textContent = 'same file';
        const w0 = place(c, at(0.04 + 0.022 * Math.max(0, t - ZOM[0].from), ZOM[0].side));
        fileTag.setAttribute('x', K.fx((w0[0] + w[0]) / 2)); fileTag.setAttribute('y', K.fx(Math.max(w0[1], w[1]) + 46));
        fileTag.setAttribute('opacity', (vis * K.eo(K.seg(t, 14.6, 15.2))).toFixed(3));
      }
    });
    // ---- beat C: the horde climbs ----
    HORDE.forEach(h => {
      const vis = K.eo(K.seg(t, h.from, h.from + 0.8));
      const s = Math.min(h.cap, h.s0 + h.sp * Math.max(0, t - h.from) + 0.2 * K.eo(K.seg(t, h.from, C1)));
      const w = place(c, at(Math.max(0, s), h.side));
      sprite(h.S, h.kind, w, 7.5 * K.F / w[2], K.GREY, vis, walk);
    });

    // ---- the tally, bottom right ----
    let tally = '';
    if (t >= 1.4 && t < A1 + 0.3) {
      const started = Math.round(384 * K.eo(K.seg(t, 1.4, 5.0)));
      const died = Math.round(341 * K.eo(K.seg(t, 5.3, 7.4)));
      tally = started + ' started' + (died ? ', ' + died + ' died' : '');
    } else if (t >= 10.6 && t < B1 + 0.3) {
      tally = Math.round(947 * K.eo(K.seg(t, 10.6, 16.5))) + ' minutes after "stopped"';
    }
    $('tally1').textContent = tally;
    $('tally').setAttribute('opacity', (tally ? 1 : 0) * open);

    K.fade($('capA'), t, A0 + 1.6, A1);
    K.fade($('capB'), t, A1 + 0.6, B1);
    K.fade($('capC'), t, B1 + 0.6, null);
    $('fade').setAttribute('opacity', (1 - open + K.ei(K.seg(t, C1 + 0.2, C1 + 0.9))).toFixed(3));
  }
  K.player(DUR, HOLD, render, 'horde');
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Altitude, together</title>
<link rel="stylesheet" href="fonts.css">
<script>if (/[?&]deck/.test(location.search)) document.documentElement.classList.add('deck');</script>
<style>
  html, body { margin:0; background:#0e0d0c; overflow:hidden }
  #film { display:block; width:100vw; height:100vh }
  #hud { position:fixed; left:14px; bottom:10px; font:13px system-ui, sans-serif; color:rgba(242,236,228,.5) }
  html.deck #hud { display:none }
</style>
</head>
<body>
<svg id="film" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Altitude, together: five people on one contour map, connected to one shared goal">
  <style>
    .serif { font-family:'Source Serif 4', Georgia, 'Times New Roman', serif; font-weight:700 }
    .sans { font-family:Manrope, 'Helvetica Neue', Arial, sans-serif; font-weight:700 }
    #h0, #h1, #h2, #h3, #h4, #sub4 { paint-order:stroke;stroke:#0e0d0c;stroke-width:12px;stroke-linejoin:round }
  </style>
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="56%" r="58%"><stop offset="0" stop-color="#2a2622"/><stop offset="1" stop-color="#0e0d0c"/></radialGradient>
    <filter id="og" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="halo" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="#0e0d0c"/>
  <rect width="1920" height="1080" fill="url(#bgGlow)" opacity=".55"/>
  <g id="terrain" fill="none" stroke-linecap="round" stroke-linejoin="round"></g>
  <g id="guesses" fill="none" stroke="#d9d2c9" stroke-width="2.5" stroke-dasharray="6 12" stroke-linecap="round"></g>
  <g id="links" fill="none" stroke="#f2ece4" stroke-linecap="round"></g>
  <g id="sparks" fill="#f2ece4"></g>
  <g id="dots" fill="#d9d2c9"></g>
  <g id="walkers" fill="#ff6a1f" filter="url(#og)"></g>
  <g id="arcs" fill="none" stroke="#ff6a1f" stroke-width="5" stroke-dasharray="20 15" stroke-linecap="round" filter="url(#og)"></g>
  <g id="flag"><line id="pole" stroke="#f2ece4" stroke-width="4"/><path id="pennant" fill="#ff6a1f" filter="url(#og)"/></g>
  <g id="labels"></g>
  <g id="chips"></g>
  <g class="serif" text-anchor="middle" font-size="76" fill="#f2ece4">
    <text id="h0" x="960" y="142">Better still: the goal beyond the goal</text>
    <text id="h1" x="960" y="142">Everyone works from their own map</text>
    <text id="h2" x="960" y="142">Different work. One goal.</text>
    <text id="h3" x="960" y="142">Share what each one learns</text>
    <text id="h4" x="960" y="142">Shared context</text>
  </g>
  <text id="sub4" class="sans" x="960" y="200" text-anchor="middle" font-size="32" fill="#a6a098" style="font-weight:600">One team, one shared picture.</text>
</svg>
<div id="hud"></div>
<script>
/* Altitude, together. The world, camera and drawing code are Claude Motion's Altitude film (altitude.html),
   unchanged, so this film opens on the exact camera pose and colors that film holds on. New: four more
   people's hills, their walkers, the links between their maps, and every outcome converging on one goal.
   Every frame is a pure function of t. ?deck plays once and holds the last frame; ?t=12 freezes a frame. */
(function () {
  const NS = 'http://www.w3.org/2000/svg', DUR = 24;
  const clamp01 = x => Math.min(1, Math.max(0, x));
  const seg = (t, a, b) => clamp01((t - a) / (b - a));
  const lerp = (a, b, p) => a + (b - a) * p;
  const eo = x => 1 - Math.pow(1 - x, 3), ei = x => x * x * x;
  const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  function rng(s) { let a = s >>> 0; return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const mk = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const $ = id => document.getElementById(id);
  const fx = n => n.toFixed(1);

  // ---------- the Altitude film's camera, to read its final pose (climb time 18.2 = film time 21.0) ----------
  const F = 1150;
  const K = [
    { t: 2.0, tx: -60, ty: 0, tz: 250, d: 2700, yaw: -0.22, pitch: 1.30 },
    { t: 7.8, tx: -150, ty: 70, tz: 80, d: 1550, yaw: -0.05, pitch: 0.40 },
    { t: 11.6, tx: -160, ty: 70, tz: 20, d: 1250, yaw: 0.04, pitch: 0.36 },
    { t: 15.0, tx: 200, ty: 250, tz: 440, d: 2750, yaw: -0.36, pitch: 0.36 },
    { t: 19.2, tx: 210, ty: 250, tz: 460, d: 2620, yaw: -0.40, pitch: 0.37 }];
  function altitudeParams(t) {
    let a = K[0], b = K[0], p = 0;
    if (t > K[0].t && t < K[K.length - 1].t) {
      for (let i = 0; i < K.length - 1; i++) if (t >= K[i].t && t <= K[i + 1].t) { a = K[i]; b = K[i + 1]; const s = seg(t, a.t, b.t); p = i === 3 ? (s + eio(s)) / 2 : eio(s); break; }
    } else if (t >= K[K.length - 1].t) a = b = K[K.length - 1];
    const c = {}; for (const k of ['tx', 'ty', 'tz', 'd', 'yaw', 'pitch']) c[k] = lerp(a[k], b[k], p);
    c.yaw += 0.004 * t; c.d -= 6 * t;
    return c;
  }
  // This film's camera: starts on that pose, pulls back to show the whole team, then settles.
  const J = [
    Object.assign({ t: 0 }, altitudeParams(18.2)),
    { t: 1.0, ...altitudeParams(18.2) },
    { t: 6.5, tx: -60, ty: 120, tz: 700, d: 4300, yaw: -0.18, pitch: 0.58 },
    { t: 12.5, tx: -40, ty: 130, tz: 740, d: 4150, yaw: -0.14, pitch: 0.60 },
    { t: 17.0, tx: 0, ty: 200, tz: 780, d: 3900, yaw: -0.12, pitch: 0.55 },
    { t: 24.0, tx: 20, ty: 220, tz: 800, d: 3750, yaw: -0.10, pitch: 0.53 }];
  function cam(t) {
    let a = J[J.length - 1], b = a, p = 0;
    for (let i = 0; i < J.length - 1; i++) if (t >= J[i].t && t <= J[i + 1].t) { a = J[i]; b = J[i + 1]; p = eio(seg(t, a.t, b.t)); break; }
    const c = {}; for (const k of ['tx', 'ty', 'tz', 'd', 'yaw', 'pitch']) c[k] = lerp(a[k], b[k], p);
    const cy = Math.cos(c.yaw), sy = Math.sin(c.yaw), cp = Math.cos(c.pitch), sp = Math.sin(c.pitch);
    c.F = [sy * cp, -sp, cy * cp]; c.R = [cy, 0, -sy]; c.U = [sy * sp, cp, cy * sp];
    c.C = [c.tx - c.d * c.F[0], c.ty - c.d * c.F[1], c.tz - c.d * c.F[2]];
    return c;
  }
  function proj(c, x, y, z, o) {
    const vx = x - c.C[0], vy = y - c.C[1], vz = z - c.C[2];
    const zc = vx * c.F[0] + vy * c.F[1] + vz * c.F[2];
    o[0] = 960 + F * (vx * c.R[0] + vz * c.R[2]) / zc;
    o[1] = 540 - F * (vx * c.U[0] + vy * c.U[1] + vz * c.U[2]) / zc;
    o[2] = zc; return o;
  }
  function ring(cx, cz, y, rad, wob, ph, sx, sz) {
    const N = 72, a = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) {
      const th = i / N * Math.PI * 2;
      const rr = rad * (1 + wob * (0.55 * Math.sin(2 * th + ph[0]) + 0.3 * Math.sin(3 * th + ph[1]) + 0.18 * Math.sin(5 * th + ph[2])));
      a[i * 3] = cx + Math.cos(th) * rr * sx; a[i * 3 + 1] = y; a[i * 3 + 2] = cz + Math.sin(th) * rr * sz;
    }
    return a;
  }
  function curve(pts, per) {
    const out = [];
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
      for (let j = 0; j < per; j++) {
        const s = j / per, s2 = s * s, s3 = s2 * s;
        out.push([0, 1].map(k => 0.5 * (2 * p1[k] + (-p0[k] + p2[k]) * s + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * s2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * s3)));
      }
    }
    out.push(pts[pts.length - 1].slice());
    const len = [0];
    for (let i = 1; i < out.length; i++) len.push(len[i - 1] + Math.hypot(out[i][0] - out[i - 1][0], out[i][1] - out[i - 1][1]));
    return { pts: out, len, total: len[len.length - 1] };
  }
  function along(path, s) {
    const L = path.len; let i = 1;
    while (i < L.length - 1 && L[i] < s) i++;
    const p = clamp01((s - L[i - 1]) / ((L[i] - L[i - 1]) || 1));
    return [lerp(path.pts[i - 1][0], path.pts[i][0], p), lerp(path.pts[i - 1][1], path.pts[i][1], p)];
  }

  // ---------- the world: Altitude's four hills, unchanged, plus four more people's hills ----------
  const BASE = [
    { id: 'o', x: -120, z: 0, h: 150, r: 260, n: 11, seed: 3, fade: 1 },
    { id: 'm', x: 520, z: 900, h: 540, r: 620, n: 26, seed: 7, fade: 1 },
    { id: 'w', x: -950, z: 520, h: 120, r: 520, n: 9, seed: 11, fade: 0.9 },
    { id: 'f', x: -350, z: 2100, h: 260, r: 620, n: 14, seed: 5, fade: 0.55 }];
  const NEW = [
    { id: 'q1', x: 1350, z: 250, h: 170, r: 300, n: 11, seed: 13, fade: 1 },
    { id: 'q2', x: 1650, z: 1250, h: 150, r: 290, n: 10, seed: 17, fade: 1 },
    { id: 'q3', x: -1850, z: 1150, h: 160, r: 300, n: 10, seed: 19, fade: 1 }];
  // the five people: whose hill, their role, when their hill appears and when they walk
  const PEOPLE = [
    { hill: 'o', role: 'you', show: -1, walk: -1 },
    { hill: 'w', role: 'sales', show: 1.6, walk: 4.6 },
    { hill: 'q1', role: 'data', show: 2.0, walk: 5.1 },
    { hill: 'q2', role: 'product', show: 2.4, walk: 5.6 },
    { hill: 'q3', role: 'engineering', show: 2.8, walk: 6.1 }];
  const appear = (id, t) => { const P = PEOPLE.find(p => p.hill === id && p.show >= 0); if (!P || id === 'w') return 1; return eio(seg(t, P.show, P.show + 1.6)); };
  const TOPS = {}, TASKS = { o: [-253, 0, -177] };

  const lines = [];
  const addHill = (H, isNew) => {
    const r = rng(H.seed); const ph = [r() * 6.3, r() * 6.3, r() * 6.3]; const lean = r() * 6.3;
    for (let i = 0; i < H.n; i++) {
      const qv = 0.05 + 0.935 * i / (H.n - 1);
      const cx = H.x + Math.cos(lean) * H.r * 0.07 * qv, cz = H.z + Math.sin(lean) * H.r * 0.07 * qv;
      lines.push({ pts: ring(cx, cz, qv * H.h, H.r * Math.sqrt(Math.log(qv) / Math.log(0.05)), 0.11 * (1 - 0.6 * qv), ph, 1, 1), closed: true, fade: H.fade, hill: H.id, ring: i, of: H.n, born: isNew ? H.id : null });
    }
    const tq = 0.985;
    TOPS[H.id] = [H.x + Math.cos(lean) * H.r * 0.07 * tq, H.h * tq, H.z + Math.sin(lean) * H.r * 0.07 * tq];
    if (H.id !== 'f') [1.14, 1.34, 1.6].forEach((m, j) => {
      lines.push({ pts: ring(H.x, H.z, 0, H.r * m, 0.16 + j * 0.05, [ph[0] + j * 0.7, ph[1] - j * 0.9, ph[2] + j * 1.3], 1.05, 0.95), closed: true, fade: H.fade * 0.85, born: isNew ? H.id : null });
    });
  };
  BASE.forEach(H => addHill(H, false));
  // flat-ground loops and long contour lines: generated exactly as in Altitude (same seeds, same skip rules)
  const under = (x, z, pad) => { for (const H of NEW) if (Math.hypot(x - H.x, z - H.z) < H.r * 1.7 + pad) return H.id; return null; };
  const rr = rng(21);
  for (let n = 0; n < 70 && lines.length < 140; n++) {
    const x = lerp(-2600, 2600, rr()), z = lerp(-1100, 3400, rr()), rad = 45 + rr() * 170;
    const sx = 0.7 + rr() * 0.7, ph = [rr() * 6.3, rr() * 6.3, rr() * 6.3], k = 1 + Math.floor(rr() * 3);
    if (BASE.some(H => Math.hypot(x - H.x, z - H.z) < H.r * 1.6 + rad)) continue;
    if (Math.hypot(x + 520, z + 420) < 330) continue;
    const u = under(x, z, rad);
    for (let j = 0; j < k; j++) lines.push({ pts: ring(x, z, 0, rad * (1 - j * 0.3), 0.26, ph, sx, 2 - sx), closed: true, fade: 0.8, under: u });
  }
  for (let i = 0; i < 7; i++) {
    const ph = rr() * 6.3, ph2 = rr() * 6.3, z0 = -900 + i * 620 + rr() * 200; let cur = [], curU = null;
    const flush = () => { if (cur.length > 3) lines.push({ pts: new Float32Array(cur), closed: false, fade: 0.7, under: curU }); cur = []; };
    for (let x = -3000; x <= 3000; x += 70) {
      const z = z0 + 130 * Math.sin(x / 420 + ph) + 55 * Math.sin(x / 160 + ph2);
      if (BASE.some(H => Math.hypot(x - H.x, z - H.z) < H.r * 1.75)) { flush(); curU = null; continue; }
      const u = under(x, z, 0);
      if (u !== curU) { const last = cur.slice(-3); flush(); cur = last.length ? last : []; curU = u; }
      cur.push(x, 0, z);
    }
    flush();
  }
  NEW.forEach(H => addHill(H, true));
  [...BASE, ...NEW].forEach(H => { if (!TASKS[H.id]) TASKS[H.id] = [H.x - 0.3 * H.r, 0, H.z - 0.72 * H.r]; });
  const terrain = $('terrain');
  lines.forEach(L => { L.el = mk('path', {}, terrain); L.glow = false; });

  // ---------- walkers, one per person ----------
  const BODY = ['0000110000', '0011111100', '0111111110', '0110110110', '0111111110', '1111111111', '0111111110', '0011111100'];
  const LEGS = [['0110000110', '0110000110'], ['0011001100', '0001001000']];
  const MAIN = [217, 210, 201], ACC = [255, 106, 31];
  const mix = k => [0, 1, 2].map(i => Math.round(lerp(MAIN[i], ACC[i], k)));
  const ALT_PATH = [[-900, -700], [-760, -610], [-640, -560], [-560, -450], [-470, -380], [-380, -330], [-310, -262], [-292, -205]];
  PEOPLE.forEach((P, i) => {
    let pts;
    if (P.hill === 'o') pts = ALT_PATH;
    else {
      const T = TASKS[P.hill], s = [T[0] - 430 + 60 * i, T[2] - 560];
      pts = [0, 1, 2, 3, 4, 5].map(j => { const u = j / 5; return [lerp(s[0], T[0], u) + Math.sin(u * 6 + i) * 60 * (1 - u), lerp(s[1], T[2], u)]; });
    }
    P.path = curve(pts, 12);
    P.g = mk('g', {}, $('walkers'));
    P.pix = []; for (let r = 0; r < 10; r++) for (let q = 0; q < 10; q++) P.pix.push({ r, q, el: mk('rect', {}, P.g) });
    P.dots = []; for (let s = 0; s < P.path.total; s += 24) P.dots.push({ s, el: mk('circle', { r: 0 }, $('dots')) });
  });

  // ---------- labels (Altitude's pill style) ----------
  const labelsG = $('labels'), labels = {};
  const addLabel = (k, txt, len) => {
    const g = mk('g', {}, labelsG);
    const lead = mk('line', { 'stroke-width': 2, 'stroke-linecap': 'round' }, g);
    const pin = mk('ellipse', { rx: 7, ry: 4 }, g);
    const halo = mk('rect', { rx: 16, fill: 'none', stroke: '#ff6a1f', 'stroke-width': 6, filter: 'url(#halo)' }, g);
    const box = mk('rect', { rx: 16, fill: '#252321', 'stroke-width': 2 }, g);
    const text = mk('text', { class: 'sans', 'font-size': 30, fill: '#f2ece4', 'text-anchor': 'middle' }, g);
    text.textContent = txt;
    labels[k] = { g, lead, pin, halo, box, text, len, w: 220, h: 56 };
  };
  addLabel('task', 'the task', 86); addLabel('out', 'the outcome', 120); addLabel('goal', 'the goal beyond the goal', 112);
  addLabel('shared', 'the shared goal', 150);
  PEOPLE.forEach(P => addLabel('r_' + P.hill, P.role, 70));
  function measure() { for (const k in labels) { const L = labels[k]; if (!L.wr) L.w = Math.round(30 * L.text.textContent.length * 0.55 + 48); try { const n = L.text.getComputedTextLength(); if (n > 0) { L.w = n + 48; L.wr = 1; } } catch (e) {} } if (typeof CHIPS !== 'undefined') CHIPS.forEach(C => { try { const n = C.tx.getComputedTextLength(); if (n > 0) C.w = n + 44; } catch (e) {} }); }
  addEventListener('resize', () => { measure(); try { render(now); } catch (e) {} });

  // ---------- links between maps, guesses toward the summit, arcs to the shared goal ----------
  const peaks = PEOPLE.map(P => P.hill);
  const linkPairs = [];
  peaks.forEach(a => {
    const near = peaks.filter(b => b !== a).sort((b1, b2) => Math.hypot(TOPS[a][0] - TOPS[b1][0], TOPS[a][2] - TOPS[b1][2]) - Math.hypot(TOPS[a][0] - TOPS[b2][0], TOPS[a][2] - TOPS[b2][2])).slice(0, 2);
    near.forEach(b => { if (!linkPairs.some(p => (p[0] === a && p[1] === b) || (p[0] === b && p[1] === a))) linkPairs.push([a, b]); });
  });
  const linkEls = linkPairs.map(() => mk('path', {}, $('links')));
  const sparkEls = linkPairs.map(() => [0, 1].map(() => mk('circle', { r: 0 }, $('sparks'))));
  const guessEls = PEOPLE.map(() => mk('path', {}, $('guesses')));
  const arcEls = PEOPLE.map(() => mk('path', {}, $('arcs')));
  const bez = (A, B, lift, s) => { const u = 1 - s, M = [(A[0] + B[0]) / 2, (A[1] + B[1]) / 2 + lift, (A[2] + B[2]) / 2]; return [0, 1, 2].map(k => u * u * A[k] + 2 * u * s * M[k] + s * s * B[k]); };

  // what travels along the links: one person's learning arriving on another's map
  const CHIPS = [{ from: 'q1', to: 'o', text: 'a decision', at: 13.9 }, { from: 'w', to: 'q2', text: 'a customer note', at: 14.6 }, { from: 'q3', to: 'q1', text: 'a fix', at: 15.3 }];
  CHIPS.forEach(C => {
    C.g = mk('g', {}, $('chips'));
    C.box = mk('rect', { rx: 22, fill: '#ff6a1f', stroke: '#0e0d0c', 'stroke-width': 2 }, C.g);
    C.tx = mk('text', { class: 'sans', 'font-size': 30, fill: '#0e0d0c', 'text-anchor': 'middle' }, C.g); C.tx.textContent = C.text;
    C.w = 30 * C.text.length * 0.55 + 44;
  });

  // ---------- render ----------
  const P3 = [0, 0, 0];
  function render(t) {
    const c = cam(t), pull = eio(seg(t, 1.0, 6.5)), depthRef = 700 + (c.d - J[0].d);   // Altitude's depth fade, carried with the camera
    // which hills are lit: the mountain fades to neutral, each person's hill lights when they reach their task,
    // and at the end the mountain lights again as everyone's shared goal
    const kM = i => Math.max(1 - eio(seg(t, 1.0, 2.6)), eio(seg(t, 17.8 + i * 0.07, 18.3 + i * 0.07)));
    const kHill = (id, i, of) => {
      if (id === 'm') return kM(i);
      const P = PEOPLE.find(q => q.hill === id); if (!P) return 0;
      const start = P.hill === 'o' ? 3.2 : P.walk + 3.4;
      return eio(seg(t, start + i * 0.09, start + 0.45 + i * 0.09));
    };
    for (const L of lines) {
      let vis = 1;
      if (L.born) vis = appear(L.born, t);
      else if (L.under) vis = 1 - appear(L.under, t);
      if (vis <= 0.001) { L.el.setAttribute('d', 'M0 0'); L.el.setAttribute('stroke-opacity', 0); continue; }
      const pts = L.pts, n = pts.length / 3, k = L.hill ? kHill(L.hill, L.ring, L.of) : 0;
      let d = '', pen = false, zs = 0, zn = 0;
      for (let i = 0; i <= n; i++) {
        if (i === n && !L.closed) break;
        const j = (i % n) * 3; proj(c, pts[j], pts[j + 1], pts[j + 2], P3);
        if (P3[2] < 60 || P3[0] < -800 || P3[0] > 2720) { pen = false; continue; }
        zs += P3[2]; zn++;
        d += (pen ? 'L' : 'M') + fx(P3[0]) + ' ' + fx(P3[1]); pen = true;
      }
      L.el.setAttribute('d', d || 'M0 0');
      if (!zn) { L.el.setAttribute('stroke-opacity', 0); continue; }
      const da = Math.min(0.95, Math.max(0.16, 1.2 - (zs / zn - depthRef) / 3400)), col = mix(k);
      L.el.setAttribute('stroke', 'rgb(' + col.join(',') + ')');
      L.el.setAttribute('stroke-opacity', (lerp(da * L.fade * 0.85, 1, k) * vis).toFixed(3));
      L.el.setAttribute('stroke-width', lerp(2.0, 2.8, k).toFixed(2));
      const g = k > 0.02; if (g !== L.glow) { L.glow = g; if (g) L.el.setAttribute('filter', 'url(#og)'); else L.el.removeAttribute('filter'); }
    }

    // walkers and their dotted paths
    const grow = lerp(1, 2.1, pull);
    PEOPLE.forEach(P => {
      const isYou = P.hill === 'o';
      const wv = isYou ? 1 : eo(seg(t, P.walk - 0.4, P.walk));
      const wp = isYou ? 1 : seg(t, P.walk, P.walk + 3.2);
      const sNow = P.path.total * (wp * wp * (3 - 2 * wp) * 0.35 + wp * 0.65);
      for (const D of P.dots) {
        if (wv <= 0 || D.s >= sNow - 30) { D.el.setAttribute('r', 0); continue; }
        const g = along(P.path, D.s); proj(c, g[0], 0, g[1], P3);
        if (P3[2] < 60) { D.el.setAttribute('r', 0); continue; }
        D.el.setAttribute('cx', fx(P3[0])); D.el.setAttribute('cy', fx(P3[1])); D.el.setAttribute('r', Math.max(1.6, 2600 * grow / P3[2]).toFixed(2));
        D.el.setAttribute('opacity', (0.9 * wv).toFixed(3));
      }
      const wg = along(P.path, sNow); proj(c, wg[0], 0, wg[1], P3);
      if (wv > 0 && P3[2] > 60) {
        P.g.style.display = ''; P.g.setAttribute('opacity', wv.toFixed(3));
        const ps = 6.5 * F / P3[2] * grow, walking = !isYou && t > P.walk && t < P.walk + 3.2, fr = walking ? Math.floor(t * 4) % 2 : 0, rows = BODY.concat(LEGS[fr]);
        const bob = fr ? -ps * 0.5 : Math.sin(t * 2.4 + PEOPLE.indexOf(P)) * ps * 0.15, x0 = P3[0] - ps * 5, y0 = P3[1] - ps * rows.length + bob;
        for (const px of P.pix) {
          if (rows[px.r][px.q] !== '1') { px.el.setAttribute('width', 0); continue; }
          px.el.setAttribute('x', fx(x0 + px.q * ps)); px.el.setAttribute('y', fx(y0 + px.r * ps));
          px.el.setAttribute('width', (ps + 0.6).toFixed(2)); px.el.setAttribute('height', (ps + 0.6).toFixed(2));
        }
      } else P.g.style.display = 'none';
    });

    // guesses: alone, each person's line toward the summit stops short
    const gIn = eio(seg(t, 9.8, 11.6)), gOut = 1 - eio(seg(t, 12.6, 13.4));
    PEOPLE.forEach((P, i) => {
      const el = guessEls[i]; if (gIn <= 0 || gOut <= 0) { el.style.display = 'none'; return; }
      el.style.display = ''; let d = '';
      const end = Math.round(40 * 0.42 * eio(seg(t, 9.8 + i * 0.18, 11.2 + i * 0.18)));
      for (let s = 0; s <= end; s++) { const q = bez(TOPS[P.hill], TOPS.m, 260, s / 40); proj(c, q[0], q[1], q[2], P3); d += (s ? 'L' : 'M') + fx(P3[0]) + ' ' + fx(P3[1]); }
      el.setAttribute('d', d || 'M0 0'); el.setAttribute('opacity', (0.55 * gOut).toFixed(3));
    });

    // links: each person's map joined to the nearest others, with sparks running both ways
    const lIn = t >= 13.2;
    linkPairs.forEach((pr, i) => {
      const el = linkEls[i], u = eio(seg(t, 13.3 + i * 0.22, 14.5 + i * 0.22));
      if (!lIn || u <= 0) { el.style.display = 'none'; sparkEls[i].forEach(s => s.setAttribute('r', 0)); return; }
      el.style.display = ''; let d = ''; const N = 40, end = Math.round(N * u);
      const A = TOPS[pr[0]], B = TOPS[pr[1]];
      for (let s = 0; s <= end; s++) { const q = bez(A, B, 110, s / N); proj(c, q[0], q[1], q[2], P3); d += (s ? 'L' : 'M') + fx(P3[0]) + ' ' + fx(P3[1]); }
      el.setAttribute('d', d); el.setAttribute('stroke-width', 2.4); el.setAttribute('stroke-opacity', 0.8);
      sparkEls[i].forEach((sp, j) => {
        if (u < 1) { sp.setAttribute('r', 0); return; }
        let s = ((t - 14.5) * 0.45 + i * 0.17 + j * 0.5) % 1; if (j) s = 1 - s;
        const q = bez(A, B, 110, s); proj(c, q[0], q[1], q[2], P3);
        sp.setAttribute('cx', fx(P3[0])); sp.setAttribute('cy', fx(P3[1])); sp.setAttribute('r', (Math.max(3, 9000 / P3[2])).toFixed(2));
        sp.setAttribute('opacity', (0.9 * (1 - eio(seg(t, 17.2, 18.4)))).toFixed(3));
      });
    });

    // chips ride a link from one map to another, then settle on the receiving map
    CHIPS.forEach(C => {
      const u = eio(seg(t, C.at, C.at + 1.4)), v = eo(seg(t, C.at - 0.2, C.at + 0.2)) * (1 - eio(seg(t, 17.6, 18.1)));
      if (v <= 0) { C.g.style.display = 'none'; return; }
      C.g.style.display = '';
      const q = bez(TOPS[C.from], TOPS[C.to], 110, u); proj(c, q[0], q[1], q[2], P3);
      const x = P3[0], y = P3[1] - 164, w = C.w;   // rides above the role labels (they sit 70 to 126 px over a hill)
      C.box.setAttribute('x', fx(x - w / 2)); C.box.setAttribute('y', fx(y - 26)); C.box.setAttribute('width', fx(w)); C.box.setAttribute('height', 52);
      C.tx.setAttribute('x', fx(x)); C.tx.setAttribute('y', fx(y + 10)); C.g.setAttribute('opacity', v.toFixed(3));
    });

    // arcs: every outcome to the one shared goal
    PEOPLE.forEach((P, i) => {
      const el = arcEls[i], u = eio(seg(t, 17.4 + i * 0.32, 18.9 + i * 0.32));
      // the first arc (yours) is Altitude's own arc, already drawn when this film opens; it fades before the team's arcs redraw
      const own = P.hill === 'o' ? 1 - eio(seg(t, 1.0, 2.2)) : 0;
      const k = Math.max(u, own);
      if (k <= 0) { el.style.display = 'none'; return; }
      el.style.display = ''; let d = ''; const N = 80, end = Math.round(N * (u > 0 ? u : 1));
      for (let s = 0; s <= end; s++) { const q = bez(TOPS[P.hill], TOPS.m, 340, s / N); proj(c, q[0], q[1], q[2], P3); d += (s ? 'L' : 'M') + fx(P3[0]) + ' ' + fx(P3[1]); }
      el.setAttribute('d', d); el.setAttribute('opacity', (u > 0 ? 1 : own).toFixed(3));
    });

    // the flag on the summit: up at the start (Altitude's), down while everyone climbs alone, up again at the end
    const fl = eio(seg(t, 19.0, 19.6));   // Altitude ends with no flag, so the flag only goes up at the end
    proj(c, TOPS.m[0], TOPS.m[1], TOPS.m[2], P3);
    if (fl > 0.01) {
      const hgt = 26000 / P3[2] * fl, x = P3[0], y = P3[1];
      $('pole').setAttribute('x1', fx(x)); $('pole').setAttribute('x2', fx(x)); $('pole').setAttribute('y1', fx(y)); $('pole').setAttribute('y2', fx(y - hgt));
      $('pennant').setAttribute('d', 'M' + fx(x) + ' ' + fx(y - hgt) + 'l' + fx(hgt * 0.62) + ' ' + fx(hgt * 0.2) + 'l' + fx(-hgt * 0.62) + ' ' + fx(hgt * 0.2) + 'z');
      $('flag').style.display = ''; $('flag').setAttribute('opacity', fl.toFixed(3));
    } else $('flag').style.display = 'none';

    // labels
    const place = (k, pt, grow, show, aimK) => {
      const L = labels[k]; proj(c, pt[0], pt[1], pt[2], P3);
      if (P3[2] < 60 || (grow <= 0 && show <= 0)) { L.g.style.display = 'none'; return; }
      L.g.style.display = '';
      const x = P3[0], y = P3[1], len = L.len, col = 'rgb(' + mix(aimK).join(',') + ')';
      L.pin.setAttribute('cx', fx(x)); L.pin.setAttribute('cy', fx(y)); L.pin.setAttribute('opacity', Math.min(1, grow * 3)); L.pin.setAttribute('fill', col);
      L.lead.setAttribute('x1', fx(x)); L.lead.setAttribute('x2', fx(x)); L.lead.setAttribute('y1', fx(y)); L.lead.setAttribute('y2', fx(y - len * grow)); L.lead.setAttribute('stroke', col);
      const bx = x - L.w / 2, by = y - len - L.h + (1 - show) * 14;
      for (const r of [L.box, L.halo]) { r.setAttribute('x', fx(bx)); r.setAttribute('y', fx(by)); r.setAttribute('width', fx(L.w)); r.setAttribute('height', L.h); }
      L.box.setAttribute('stroke', aimK > 0 ? col : 'rgb(116,112,107)'); L.box.setAttribute('opacity', show.toFixed(3));
      L.halo.setAttribute('opacity', (show * aimK * 0.55).toFixed(3));
      L.text.setAttribute('x', fx(x)); L.text.setAttribute('y', fx(by + L.h / 2 + 10.5)); L.text.setAttribute('opacity', show.toFixed(3));
    };
    const off = 1 - eio(seg(t, 0.8, 1.6));
    place('task', TASKS.o, off, off, 0);
    place('out', TOPS.o, off, off, 0);
    place('goal', TOPS.m, off, off, 1);
    PEOPLE.forEach(P => {
      const start = P.hill === 'o' ? 3.0 : P.walk + 3.3, v = eo(seg(t, start, start + 0.5));
      place('r_' + P.hill, TOPS[P.hill], v, v, eio(seg(t, start + 0.2, start + 0.8)) * (1 - 0.5 * eio(seg(t, 17.6, 18.6))));
    });
    const sv = eo(seg(t, 19.4, 19.9)); place('shared', TOPS.m, sv, sv, 1);

    // headlines
    [[-1, 0.6], [2.4, 8.9], [9.4, 12.6], [13.0, 17.6], [18.0, 99]].forEach((H, i) => {
      const a = H[0] < 0 ? 1 : eo(seg(t, H[0], H[0] + 0.6)), b = ei(seg(t, H[1], H[1] + 0.4)), el = $('h' + i);
      el.setAttribute('opacity', (a * (1 - b)).toFixed(3));
      el.setAttribute('transform', 'translate(0 ' + fx((1 - a) * 24 - b * 16 + (i === 0 ? -6.72 - t * 1.2 : 0)) + ')');
    });
    $('sub4').setAttribute('opacity', eo(seg(t, 18.4, 19.0)).toFixed(3));
  }

  // ---------- player: plays once and holds (deck), or loops (standalone); ?t freezes ----------
  const Q = new URLSearchParams(location.search), FROZEN = Q.has('t'), DECK = Q.has('deck');
  const WAIT = Q.has('wait');
  let now = FROZEN ? +Q.get('t') : 0, playing = !FROZEN && !WAIT, last = null;
  addEventListener('message', e => { if (e.data === 'play') { measure(); now = 0; playing = true; last = null; } if (e.data === 'end') { now = DUR; playing = false; render(now); } });
  window.DURATION = DUR; window.render = render;
  window.seek = t => { now = t; playing = false; render(now); };
  window.play = () => { if (now >= DUR) now = 0; playing = true; last = null; };
  window.pause = () => { playing = false; };
  function tick(ts) {
    if (playing) { if (last !== null) now += (ts - last) / 1000; if (now >= DUR) { if (DECK) { now = DUR; playing = false; } else now = 0; } }
    last = ts; render(now);
    if (!DECK && !FROZEN) $('hud').textContent = now.toFixed(1) + ' / ' + DUR + ' s   space pause   left/right seek';
    if (!FROZEN) requestAnimationFrame(tick);
  }
  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); playing = !playing; last = null; }
    if (e.code === 'ArrowRight') { now = Math.min(DUR, now + 1); render(now); }
    if (e.code === 'ArrowLeft') { now = Math.max(0, now - 1); render(now); }
  });
  measure(); render(now);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { measure(); render(now); });
  if (!FROZEN) requestAnimationFrame(tick);
})();
</script>
</body>
</html>

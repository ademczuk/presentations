<!doctype html>
<html><head><meta charset="utf-8"><title>Altitude, rebuilt as f(t)</title>
<style>
  html,body{margin:0;background:#0e0d0c;overflow:hidden}
  canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh}
  #hud{position:fixed;left:16px;bottom:12px;font:13px system-ui,sans-serif;color:rgba(242,236,228,.55);user-select:none}
</style></head>
<body>
<canvas id="c"></canvas><div id="hud"></div>
<script>
// Every frame is a pure function of t (seconds). window.render(t) draws it; same t, same picture.
const W = 1920, H = 1080, DUR = 22;
const cv = document.getElementById('c'), g = cv.getContext('2d');
const ORANGE = '#ff6a1f', INK = '#f2ece4', BG = '#0e0d0c';

// ---------- terrain: a height field, contoured once, projected every frame ----------
const HILLS = {
  outcome: { x: 0.44, y: 0.10, a: 0.86, s: 0.19 },
  goal:    { x: -0.22, y: 0.98, a: 1.02, s: 0.31 },
  right:   { x: 1.25, y: 0.55, a: 0.70, s: 0.28 },
  back:    { x: 0.55, y: 1.65, a: 0.55, s: 0.30 },
};
function height(x, y) {
  let h = 0;
  for (const k in HILLS) { const q = HILLS[k]; const d2 = (x-q.x)**2 + (y-q.y)**2; h += q.a * Math.exp(-d2 / (2*q.s*q.s)); }
  // low rolling ground so the flat land carries wandering contour loops
  h += 0.075*Math.sin(3.1*x+0.7)*Math.cos(2.3*y-0.4) + 0.05*Math.sin(5.3*x*y+1.3) + 0.045*Math.cos(4.1*x-2.7*y) + 0.03*Math.sin(7.7*x+3.1*y);
  return h;
}
const GX0 = -1.6, GX1 = 2.2, GY0 = -1.0, GY1 = 2.4, N = 190;
const STEP_LEVEL = 0.04, LEVELS = [];
for (let z = 0.02; z < 1.3; z += STEP_LEVEL) LEVELS.push(z);
const segs = [], TOPLV = {}; // {ax,ay,bx,by,z,lv}
(function contour() {
  const dx = (GX1-GX0)/N, dy = (GY1-GY0)/N, F = [];
  for (let j = 0; j <= N; j++) { F[j] = []; for (let i = 0; i <= N; i++) F[j][i] = height(GX0+i*dx, GY0+j*dy); }
  const lerp = (a, b, va, vb, z) => a + (b-a) * (z-va) / (vb-va);
  LEVELS.forEach((z, lv) => {
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
      const x0 = GX0+i*dx, y0 = GY0+j*dy, x1 = x0+dx, y1 = y0+dy;
      const v0 = F[j][i], v1 = F[j][i+1], v2 = F[j+1][i+1], v3 = F[j+1][i];
      const idx = (v0>z) | (v1>z)<<1 | (v2>z)<<2 | (v3>z)<<3;
      if (idx === 0 || idx === 15) continue;
      const e = [
        [lerp(x0,x1,v0,v1,z), y0], [x1, lerp(y0,y1,v1,v2,z)],
        [lerp(x0,x1,v3,v2,z), y1], [x0, lerp(y0,y1,v0,v3,z)],
      ];
      const T = {1:[[3,0]],2:[[0,1]],3:[[3,1]],4:[[1,2]],5:[[3,0],[1,2]],6:[[0,2]],7:[[3,2]],
                 8:[[2,3]],9:[[0,2]],10:[[0,1],[2,3]],11:[[1,2]],12:[[1,3]],13:[[0,1]],14:[[0,3]]}[idx];
      for (const [p, q] of T) segs.push({ ax: e[p][0], ay: e[p][1], bx: e[q][0], by: e[q][1], z, lv });
    }
  });
  // which hill a segment belongs to (for the orange climb), by distance to the hill centre at its level
  for (const s of segs) {
    const mx = (s.ax+s.bx)/2, my = (s.ay+s.by)/2;
    s.hill = null; let best = 0.12;
    for (const k in HILLS) { const q = HILLS[k]; const c = q.a*Math.exp(-((mx-q.x)**2+(my-q.y)**2)/(2*q.s*q.s)); if (c > best) { best = c; s.hill = k; } }
    if (s.hill !== 'outcome' && s.hill !== 'goal') s.hill = null;
  }
  for (const s of segs) if (s.hill) TOPLV[s.hill] = Math.max(TOPLV[s.hill] || 0, s.lv);
})();
const peak = k => ({ x: HILLS[k].x, y: HILLS[k].y, z: height(HILLS[k].x, HILLS[k].y) });

// ---------- camera ----------
const ZS = 0.78; // vertical exaggeration
const ease = u => u<=0?0:u>=1?1:u*u*(3-2*u);
const easeIO = u => u<=0?0:u>=1?1:(u<0.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2);
const mix = (a, b, u) => a + (b-a)*u;
const mix3 = (A, B, u) => A.map((v, i) => mix(v, B[i], u));
function camera(t) {
  const A = { p: [0.50, -1.85, 1.10], tg: [0.38, 0.55, 0.12] };   // terrain arrives
  const B = { p: [0.56, -1.40, 1.00], tg: [0.40, 0.50, 0.34] };   // dolly in on the small hill
  const C = { p: [0.22, -1.30, 1.40], tg: [0.02, 0.78, 0.45] };  // lift and pan: the mountain behind
  let p, tg;
  if (t < 15.6) { const u = easeIO((t-5.2)/10.4); p = mix3(A.p, B.p, u); tg = mix3(A.tg, B.tg, u); }
  else { const u = easeIO((t-15.6)/3.4); p = mix3(B.p, C.p, u); tg = mix3(B.tg, C.tg, u); }
  const f = norm(sub(tg, p)), r = norm(cross(f, [0,0,1])), up = cross(r, f);
  return { p, f, r, up, focal: 1250 };
}
const sub = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
const dot = (a, b) => a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm = a => { const l = Math.hypot(...a); return a.map(v => v/l); };
function proj(cam, x, y, z) {
  const d = sub([x, y, z*ZS], cam.p), zc = dot(d, cam.f);
  if (zc < 0.08) return null;
  return [W/2 + cam.focal*dot(d, cam.r)/zc, H/2 - cam.focal*dot(d, cam.up)/zc, zc];
}

// ---------- drawing helpers ----------
function serif(txt, x, y, size, alpha, color = INK) {
  g.save(); g.globalAlpha = alpha; g.fillStyle = color; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = `600 ${size}px Georgia, "Times New Roman", serif`; g.fillText(txt, x, y); g.restore();
}
function pill(txt, x, y, alpha, hot) {
  if (alpha <= 0) return;
  g.save(); g.globalAlpha = alpha; g.font = '600 34px "Segoe UI", system-ui, sans-serif';
  const w = g.measureText(txt).width + 44, h = 58, rx = x - w/2, ry = y - h/2;
  g.beginPath(); g.roundRect(rx, ry, w, h, 10);
  g.fillStyle = hot ? '#2a140a' : '#151413'; g.fill();
  g.lineWidth = 2; g.strokeStyle = hot ? ORANGE : 'rgba(242,236,228,0.45)';
  if (hot) { g.shadowColor = ORANGE; g.shadowBlur = 18; }
  g.stroke(); g.shadowBlur = 0;
  g.fillStyle = INK; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(txt, x, y + 1);
  g.restore();
}
// our own 8-bit walker (not anyone's mascot): 11 x 8 cells
const BOT = ['..X.....X..', '...X...X...', '..XXXXXXX..', '.XX.XXX.XX.', 'XXXXXXXXXXX', 'X.XXXXXXX.X', 'X.X.....X.X', '...XX.XX...'];
function bot(x, y, s, alpha, step) {
  g.save(); g.globalAlpha = alpha; g.fillStyle = ORANGE; g.shadowColor = ORANGE; g.shadowBlur = 12;
  const rows = BOT.slice(); if (step % 2) rows[7] = '..XX...XX..';
  rows.forEach((row, j) => [...row].forEach((c, i) => { if (c === 'X') g.fillRect(x + (i-5.5)*s, y + (j-8)*s, s+0.5, s+0.5); }));
  g.restore();
}

// the bot's route over the ground to the task, as terrain points
const TASK = { x: 0.20, y: 0.02 };
const ROUTE = [[-0.16,-0.50],[-0.12,-0.42],[-0.30,-0.47],[-0.18,-0.33],[-0.02,-0.30],[0.10,-0.16],[TASK.x, TASK.y]];
function routeAt(u) { // point along the polyline by arc fraction
  const L = []; let tot = 0;
  for (let i = 1; i < ROUTE.length; i++) { const l = Math.hypot(ROUTE[i][0]-ROUTE[i-1][0], ROUTE[i][1]-ROUTE[i-1][1]); L.push(l); tot += l; }
  let d = u*tot;
  for (let i = 0; i < L.length; i++) { if (d <= L[i]) { const k = d/L[i]; return [mix(ROUTE[i][0], ROUTE[i+1][0], k), mix(ROUTE[i][1], ROUTE[i+1][1], k)]; } d -= L[i]; }
  return ROUTE[ROUTE.length-1];
}

// ---------- the timeline ----------
const win = (t, a, b) => ease((t-a)/(b-a));   // 0..1 ramp between a and b
function render(t) {
  g.setTransform(1,0,0,1,0,0); g.fillStyle = BG; g.fillRect(0, 0, cv.width, cv.height);
  g.setTransform(VIEW.k,0,0,VIEW.k,VIEW.x,VIEW.y);
  g.save(); g.beginPath(); g.rect(0, 0, W, H); g.clip();
  try { draw(t); } finally { g.restore(); }
}
function draw(t) {
  g.fillStyle = BG; g.fillRect(0, 0, W, H);
  const vg = g.createRadialGradient(W/2, H*0.45, 200, W/2, H*0.5, 1250);
  vg.addColorStop(0, 'rgba(40,34,30,0.55)'); vg.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = vg; g.fillRect(0, 0, W, H);

  // 0 to 2.6 s: title card, an arrow lifts off the ground line
  const tc = win(t, 0, 0.6) * (1 - win(t, 2.2, 2.7));
  if (tc > 0) {
    serif('Altitude', W/2, 430, 150, tc);
    g.save(); g.globalAlpha = tc; g.strokeStyle = 'rgba(242,236,228,0.5)'; g.setLineDash([6, 8]); g.lineWidth = 2;
    g.beginPath(); g.moveTo(W/2-180, 610); g.lineTo(W/2+180, 610); g.moveTo(W/2, 610); g.lineTo(W/2, 680); g.stroke();
    g.setLineDash([]); g.strokeStyle = INK; g.lineWidth = 3; g.strokeRect(W/2-16, 594, 32, 32);
    const lift = 40 * ease((t-0.6)/1.2);
    g.strokeStyle = ORANGE; g.lineWidth = 5; g.beginPath(); g.moveTo(W/2, 590); g.lineTo(W/2, 590-lift); g.stroke();
    if (lift > 10) { g.fillStyle = ORANGE; g.beginPath(); g.moveTo(W/2, 590-lift-16); g.lineTo(W/2-12, 590-lift+2); g.lineTo(W/2+12, 590-lift+2); g.fill(); }
    g.restore();
  }

  // 2.8 to 9 s: the quote, sliding up once the terrain arrives
  const qa = win(t, 2.8, 3.4) * (1 - win(t, 8.6, 9.2));
  if (qa > 0) {
    const qy = mix(H/2 - 20, 150, win(t, 5.0, 6.4));
    g.save(); g.globalAlpha = qa; g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = '600 46px Georgia, serif';
    const a = '"letting the model operate at a ', b = 'higher abstraction', c = '"';
    const wa = g.measureText(a).width, wb = g.measureText(b).width, wc = g.measureText(c).width, x0 = W/2 - (wa+wb+wc)/2;
    g.textAlign = 'left'; g.fillStyle = INK; g.fillText(a, x0, qy); g.fillStyle = ORANGE; g.fillText(b, x0+wa, qy); g.fillStyle = INK; g.fillText(c, x0+wa+wb, qy);
    g.font = '500 24px "Segoe UI", sans-serif'; g.fillStyle = 'rgba(242,236,228,0.75)'; g.textAlign = 'center'; g.fillText('Felix Rieseberg', W/2, qy + 50);
    g.restore();
  }

  // terrain from 5.0 s
  const ta = win(t, 5.0, 6.8);
  if (ta <= 0) return;
  const cam = camera(t);
  const climbOutcome = win(t, 10.2, 12.4) * (1 - win(t, 16.0, 17.2));   // the small hill lights from the base up
  const climbGoal = win(t, 16.4, 18.6);                                   // then the mountain behind it
  const maxLv = LEVELS.length;
  const buckets = { w: [[], [], [], []], o: [[], [], [], []] };
  for (const s of segs) {
    const A = proj(cam, s.ax, s.ay, s.z), B = proj(cam, s.bx, s.by, s.z);
    if (!A || !B) continue;
    if ((A[0] < -50 && B[0] < -50) || (A[0] > W+50 && B[0] > W+50) || (A[1] < -50 && B[1] < -50) || (A[1] > H+50 && B[1] > H+50)) continue;
    const depth = (A[2]+B[2])/2, band = Math.min(3, Math.max(0, Math.floor((depth-1.1)/0.6)));
    let hot = false;
    if (s.hill === 'outcome') hot = s.lv / TOPLV.outcome < climbOutcome * 1.02;
    if (s.hill === 'goal') hot = s.lv / TOPLV.goal < climbGoal * 1.02;
    buckets[hot ? 'o' : 'w'][band].push(A[0], A[1], B[0], B[1]);
  }
  const alphaW = [0.62, 0.45, 0.30, 0.18], alphaO = [1, 0.9, 0.75, 0.6];
  g.save(); g.lineCap = 'round';
  for (let b = 3; b >= 0; b--) {
    for (const kind of ['w', 'o']) {
      const arr = buckets[kind][b]; if (!arr.length) continue;
      g.globalAlpha = ta * (kind === 'w' ? alphaW[b] : alphaO[b]);
      g.strokeStyle = kind === 'w' ? '#d9d2c9' : ORANGE; g.lineWidth = kind === 'w' ? 1.6 : 2.6;
      if (kind === 'o') { g.shadowColor = ORANGE; g.shadowBlur = 10; } else g.shadowBlur = 0;
      g.beginPath(); for (let i = 0; i < arr.length; i += 4) { g.moveTo(arr[i], arr[i+1]); g.lineTo(arr[i+2], arr[i+3]); } g.stroke();
    }
  }
  g.restore();

  // the task: a pin at the foot of the small hill
  const tk = proj(cam, TASK.x, TASK.y, height(TASK.x, TASK.y));
  const tka = win(t, 8.8, 9.6);
  if (tk && tka > 0) {
    const drop = (1 - ease((t-8.8)/0.6)) * -40;
    g.save(); g.globalAlpha = tka; g.strokeStyle = INK; g.lineWidth = 3;
    g.beginPath(); g.moveTo(tk[0], tk[1] - 150 + drop); g.lineTo(tk[0], tk[1]); g.stroke();
    g.fillStyle = INK; g.beginPath(); g.ellipse(tk[0], tk[1], 9, 5, 0, 0, 7); g.fill(); g.restore();
    pill('the task', tk[0], tk[1] - 182 + drop, tka, false);
  }

  // the outcome: the small hill's peak
  const pk = peak('outcome'), op = proj(cam, pk.x, pk.y, pk.z);
  const oa = win(t, 10.0, 10.8);
  if (op && oa > 0) {
    g.save(); g.globalAlpha = oa; g.strokeStyle = ORANGE; g.lineWidth = 3;
    g.beginPath(); g.moveTo(op[0], op[1] - 115); g.lineTo(op[0], op[1]); g.stroke();
    g.fillStyle = ORANGE; g.beginPath(); g.ellipse(op[0], op[1], 10, 6, 0, 0, 7); g.fill(); g.restore();
    pill('the outcome', op[0], op[1] - 145, oa, climbOutcome > 0.2 || climbGoal > 0.2);
  }

  // the bot walks a dotted route to the task
  const wa = win(t, 12.0, 12.6);
  if (wa > 0) {
    const u = ease((t-12.4)/3.0), pts = [];
    for (let k = 0; k <= 60; k++) { const q = routeAt(k/60*u); const P = proj(cam, q[0], q[1], height(q[0], q[1])); if (P) pts.push(P); }
    g.save(); g.globalAlpha = wa; g.fillStyle = INK;
    for (let k = 0; k < pts.length-1; k++) { g.beginPath(); g.arc(pts[k][0], pts[k][1], 3.4, 0, 7); g.fill(); }
    g.restore();
    const head = pts[pts.length-1];
    if (head) bot(head[0], head[1] - 6, 6.4, wa, Math.floor(t*6) * (u < 1 ? 1 : 0));
  }

  // headlines
  serif('Your best guess', W/2, 92, 84, win(t, 13.2, 13.8) * (1 - win(t, 15.6, 16.2)));
  serif('The goal beyond the goal', W/2, 92, 84, win(t, 17.0, 17.7));

  // the goal beyond the goal: a flag on the mountain, a dashed arc from the outcome to it
  const gk = peak('goal'), gp = proj(cam, gk.x, gk.y, gk.z);
  const fa = win(t, 18.2, 18.8);
  if (gp && fa > 0) {
    const rise = 90 * ease((t-18.2)/0.6);
    g.save(); g.globalAlpha = fa; g.strokeStyle = INK; g.lineWidth = 3;
    g.beginPath(); g.moveTo(gp[0], gp[1]); g.lineTo(gp[0], gp[1] - rise); g.stroke();
    g.fillStyle = ORANGE; g.shadowColor = ORANGE; g.shadowBlur = 14;
    g.beginPath(); g.moveTo(gp[0], gp[1]-rise); g.lineTo(gp[0]+62, gp[1]-rise+18); g.lineTo(gp[0], gp[1]-rise+38); g.fill();
    g.restore();
  }
  const arcU = win(t, 18.6, 20.2);
  if (arcU > 0) {
    const pts = [];
    for (let k = 0; k <= 80*arcU; k++) {
      const u = k/80, x = mix(pk.x, gk.x, u), y = mix(pk.y, gk.y, u), z = mix(pk.z, gk.z, u) + 0.35*Math.sin(Math.PI*u);
      const P = proj(cam, x, y, z); if (P) pts.push(P);
    }
    g.save(); g.strokeStyle = ORANGE; g.lineWidth = 5; g.setLineDash([18, 14]); g.shadowColor = ORANGE; g.shadowBlur = 10;
    g.beginPath(); pts.forEach((P, i) => i ? g.lineTo(P[0], P[1]) : g.moveTo(P[0], P[1])); g.stroke(); g.restore();
  }

  // 21 to 22 s: fade out
  const out = win(t, 21.2, 22);
  if (out > 0) { g.fillStyle = `rgba(14,13,12,${out})`; g.fillRect(0, 0, W, H); }
}
// ---------- viewport: the 1920x1080 stage is fitted to the window at device resolution, so lines stay sharp ----------
const VIEW = { k: 1, x: 0, y: 0 };
function fit() {
  const dpr = window.devicePixelRatio || 1, w = innerWidth, h = innerHeight;
  cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
  const k = Math.min(w/W, h/H)*dpr;
  VIEW.k = k; VIEW.x = (cv.width - W*k)/2; VIEW.y = (cv.height - H*k)/2;
}
// ---------- playback: plays and loops; ?t=12.5 freezes one frame (the renderer uses that) ----------
const Q = new URLSearchParams(location.search), FROZEN = Q.has('t'), DECK = Q.has('deck'), HOLD = 21.0; // ?deck: play once from 0, hold the last frame, no help line
let clock = FROZEN ? +Q.get('t') : 0, playing = !FROZEN, last = null;
const hud = document.getElementById('hud');
function frame(now) {
  if (playing) { if (last !== null) clock += (now - last)/1000; if (DECK && clock >= HOLD) { clock = HOLD; playing = false; } else if (clock >= DUR) clock = 0; }
  last = now;
  render(clock);
  if (!FROZEN && !DECK) hud.textContent = `${clock.toFixed(1)} / ${DUR}s   space pause   left/right seek   home restart   f fullscreen`;
  if (!FROZEN) requestAnimationFrame(frame);
}
addEventListener('resize', () => { fit(); if (FROZEN) render(clock); });
addEventListener('keydown', e => {
  if (e.code === 'Space') { playing = !playing; e.preventDefault(); }
  else if (e.key === 'ArrowRight') clock = Math.min(DUR - 0.01, clock + 1);
  else if (e.key === 'ArrowLeft') clock = Math.max(0, clock - 1);
  else if (e.key === 'Home') clock = 0;
  else if (e.key === 'f') (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen());
});
fit();
window.render = render; window.DUR = DUR;
if (FROZEN) { hud.style.display = 'none'; render(clock); } else requestAnimationFrame(frame);
</script>
</body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>(film embed) MeshyChat, live</title>
<style>
html,body{margin:0;height:100%;background:#05070b;overflow:hidden}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#05070b}
.cap{position:absolute;left:50%;transform:translateX(-50%);bottom:7%;padding:1.4vh 3vh;border-radius:1.4vh;background:rgba(5,7,11,.86);box-shadow:0 0 0 1px #2a3242;text-align:center;font:700 3.2vh/1.2 Manrope,Arial,sans-serif;color:#f2ece4;text-shadow:0 2px 12px #000,0 0 3px #000;opacity:0;transition:opacity .8s ease}
.cap.on{opacity:1}
.cap small{display:block;margin-top:.6vh;font-weight:600;font-size:2vh;color:#a6b4cc}
</style></head><body>
<video id="v" src="media/film/meshychat-panels.mp4" muted playsinline loop preload="auto"></video>
<div class="cap" id="c">MeshyChat at work<small>every seat and every message, one shared picture (a recording)</small></div>
<script>
(function(){var v=document.getElementById('v'),c=document.getElementById('c');
function play(){v.play().catch(function(){});setTimeout(function(){c.classList.add('on')},600);setTimeout(function(){c.classList.remove('on')},6000);}
if(document.readyState==='complete')play();else addEventListener('load',play);
/* the film steps a deck beat with Deck.next(); one press hides the caption, the next moves on */
var step=0,t1=0,t2=0;function cap(){clearTimeout(t1);clearTimeout(t2);c.classList.remove('on');t1=setTimeout(function(){c.classList.add('on')},600);t2=setTimeout(function(){c.classList.remove('on')},6000);}
window.Deck={next:function(){if(step===0){step=1;c.classList.remove('on');return true}return false},prev:function(){return false},replay:function(){step=0;try{v.currentTime=0;v.play().catch(function(){})}catch(e){}cap();},get current(){return 0}};
})();
</script></body></html>
